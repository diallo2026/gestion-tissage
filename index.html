<!DOCTYPE html>
<html lang="fr">

<style>
/* =====================================================================
   AGAT — styles
   Palette tirée de la cuve d'indigo et du léppi : indigo profond,
   bleu de cuve, blanc de coton, ocre or des fils de motif.
   ===================================================================== */
:root {
  --indigo-950: #10163a;
  --indigo-900: #141b3d;
  --indigo-800: #1f2a5a;
  --indigo-700: #22306b;
  --vat: #3d56a8;
  --vat-600: #2f4590;
  --vat-50: #edf1fb;
  --gold: #c9932e;
  --gold-50: #fbf3e2;
  --gold-ink: #7a5512;
  --bg: #f3f5fa;
  --surface: #ffffff;
  --ink: #1b2238;
  --ink-2: #4a536b;
  --ink-3: #6b7390;
  --line: #dde1ec;
  --line-2: #eceff6;
  --ok: #2f7d4f; --ok-50: #e7f4ec;
  --warn: #9a6512; --warn-50: #fcf1dc;
  --err: #b23a3a; --err-50: #fbe9e9;
  --wa: #1f8f4e;
  --r-s: 6px; --r: 8px; --r-l: 12px; --r-xl: 16px;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --side-w: 252px;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 14.5px; line-height: 1.5; color: var(--ink); background: var(--bg); font-variant-numeric: tabular-nums; }
body.has-modal { overflow: hidden; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); color: var(--ink); line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; font-weight: 650; }
h3 { font-size: 1rem; font-weight: 650; margin-top: 1.1em; }
p { margin: 0 0 .7em; }
a { color: var(--vat); }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.center { text-align: center; }
.lead { font-size: 1.05rem; color: var(--ink-2); }
.mt { margin-top: 1.4rem; }
.tx-err { color: var(--err); } .tx-ok { color: var(--ok); }
.code { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; letter-spacing: .01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ic { width: 18px; height: 18px; flex: none; vertical-align: -3px; }
:focus-visible { outline: 2px solid var(--vat); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 15px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px/1.2 var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { border-color: #c3c9db; background: #f8f9fc; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--vat); border-color: var(--vat); color: #fff; }
.btn.primary:hover { background: var(--vat-600); border-color: var(--vat-600); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.danger:hover { background: #962f2f; }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn.big { min-height: 46px; font-size: 15px; width: 100%; }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 13px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: var(--r); border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; text-decoration: none; }
.ibtn:hover { background: var(--vat-50); color: var(--vat); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--vat); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.end { justify-content: flex-end; } .row.center { justify-content: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spin { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- champs ---------- */
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.fld .req { color: var(--err); font-weight: 700; }
input, select, textarea { font: 14.5px/1.4 var(--font); color: var(--ink); background: var(--surface); border: 1px solid #cfd5e3; border-radius: var(--r); padding: 9px 11px; min-height: 40px; width: 100%; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--vat); box-shadow: 0 0 0 3px rgba(61, 86, 168, .16); }
input[readonly] { background: var(--line-2); }
input[type=checkbox] { width: 18px; height: 18px; min-height: 0; accent-color: var(--vat); }
input[type=color] { padding: 3px; height: 40px; }
.fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--err); }
.ferr { color: var(--err); font-size: 12.5px; min-height: 0; margin: 0; }
.ferr:empty { display: none; }
.chk { display: flex; align-items: flex-start; gap: 9px; padding: 6px 0; cursor: pointer; flex-wrap: wrap; }
.chk > span { font-weight: 500; }
.chk small { flex-basis: 100%; padding-left: 27px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.fgrid.cols4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: 1 / -1; }
.fsec { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.fsec h3 { margin: 0; font-size: .98rem; }
.fsec p { margin: 4px 0 0; font-size: 13px; }
.fsec:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.imgfld { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.imgprev { width: 64px; height: 64px; object-fit: contain; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
.imgfld input[type=file] { border: 0; padding: 0; min-height: 0; width: auto; }
.pwd { position: relative; } .pwd input { padding-right: 44px; } .pwd .ibtn { position: absolute; right: 3px; top: 3px; }
.code-input { font-family: "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; font-size: 16px; }

/* ---------- motif tissé (signature) ---------- */
.weave-cloth, .side::before {
  background-color: var(--indigo-800);
  background-image:
    repeating-linear-gradient(90deg, transparent 0 34px, rgba(243, 245, 250, .92) 34px 36px, transparent 36px 40px, rgba(243, 245, 250, .5) 40px 41px, transparent 41px 72px),
    repeating-linear-gradient(0deg, transparent 0 18px, rgba(16, 22, 58, .38) 18px 20px),
    repeating-linear-gradient(90deg, var(--indigo-700) 0 72px, var(--indigo-900) 72px 73px, var(--indigo-800) 73px 145px, var(--indigo-950) 145px 146px);
}

/* ---------- écrans d'accueil ---------- */
.screen { min-height: 100vh; min-height: 100dvh; }
.boot { display: grid; place-items: center; background: var(--indigo-900); color: #dfe4f3; }
.boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.landing { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.weave { position: relative; overflow: hidden; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; }
.weave-cloth { position: absolute; inset: 0; }
.weave::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16, 22, 58, .05) 0%, rgba(16, 22, 58, .78) 72%, rgba(16, 22, 58, .94) 100%); }
.weave-brand, .weave-line { position: relative; z-index: 1; }
.weave-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.weave-brand strong { display: block; font-family: var(--display); font-size: 2rem; letter-spacing: -.01em; }
.weave-brand span { color: #c9d0e6; }
.weave-line { font-size: 1.12rem; max-width: 30ch; color: #e8ebf5; margin: 0; }
.access { display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: var(--surface); }
.access-in { width: 100%; max-width: 420px; }
.access h1 { font-size: 1.9rem; }
.known { margin-top: 26px; }
.known h2 { font-size: .95rem; color: var(--ink-2); }
.known-list { display: flex; flex-direction: column; gap: 8px; }
.known-co { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: inherit; }
.known-co:hover { border-color: var(--vat); background: var(--vat-50); }
.known-co img, .mono-av { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; flex: none; }
.mono-av { display: inline-grid; place-items: center; background: var(--indigo-700); color: #fff; font-weight: 700; font-family: var(--display); }
.mono-av.big { width: 76px; height: 76px; font-size: 1.6rem; border-radius: 18px; }
.known-co strong { display: block; } .known-co small { color: var(--ink-3); }
.newco { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.newco p { margin: 0; color: var(--ink-2); }
.lnd-foot { margin-top: 32px; font-size: 12.5px; color: var(--ink-3); }
.contacts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.contacts .btn { min-height: 34px; font-size: 13px; }

/* ---------- AGAT : barre de plateforme, accueil à deux choix, connexion ---------- */
.home { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
.pbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--indigo-950); color: #fff; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.pbar-brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.pbar-brand strong { display: block; font-family: var(--display); font-size: 1.05rem; letter-spacing: .02em; line-height: 1.1; }
.pbar-brand span { display: block; font-size: 11.5px; color: #8f99bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar-back { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 1px solid rgba(255, 255, 255, .16); border-radius: var(--r); background: transparent; color: #fff; cursor: pointer; }
.pbar-back:hover { background: rgba(255, 255, 255, .08); }
.pbar-install { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .25); }
.pbar-install:hover { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .4); }

.home-hero { position: relative; overflow: hidden; flex: 1; display: flex; align-items: center; padding: 48px 20px 56px; }
.home-hero .weave-cloth { position: absolute; inset: 0; }
.home-hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 38%, rgba(16, 22, 58, .62) 0%, rgba(16, 22, 58, .9) 70%, rgba(16, 22, 58, .97) 100%); }
.home-in { position: relative; z-index: 1; width: 100%; max-width: 900px; margin: 0 auto; text-align: center; }
.lockup { display: inline-block; }
.lockup-img { display: block; width: clamp(190px, 24vw, 250px); height: auto; border-radius: 50%; box-shadow: 0 0 0 6px rgba(243, 245, 250, .12), 0 18px 44px rgba(0, 0, 0, .45); }
.brandmark { border-radius: 50%; object-fit: contain; flex: none; background: #fff; }
.boot-logo { border-radius: 50%; background: #fff; }
.side-co img.brandmark, .pb-g img.brandmark, .pbar img.brandmark { border-radius: 50%; padding: 0; width: auto; }
.home-line { color: #dfe4f3; font-size: 1.08rem; max-width: 52ch; margin: 22px auto 30px; }
.home-msg { display: inline-block; background: var(--err-50); color: var(--err); border-radius: var(--r); padding: 8px 12px; margin: 0 auto 18px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; text-align: left; }
.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 24px 22px 22px; border: 1px solid rgba(255, 255, 255, .14); border-radius: var(--r-xl); background: rgba(243, 245, 250, .97); color: var(--ink); font: inherit; cursor: pointer; text-align: left; transition: transform .15s, box-shadow .15s; }
.choice:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, .3); }
.choice:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.choice-ic { display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--vat-50); color: var(--vat); }
.choice-ic .ic { width: 22px; height: 22px; }
.choice-t { font-family: var(--display); font-size: 1.3rem; font-weight: 700; color: var(--indigo-800); line-height: 1.15; }
.choice-s { color: var(--ink-2); font-size: 14px; margin-bottom: 10px; }
.choice-go { margin-top: auto; display: inline-flex; align-items: center; min-height: 40px; padding: 8px 16px; border-radius: var(--r); border: 1px solid var(--vat); color: var(--vat); font-weight: 600; }
.choice.prime .choice-go { background: var(--vat); color: #fff; }
.choice.prime { border-top: 4px solid var(--gold); }

.pfoot { background: var(--indigo-950); color: #c9d0e6; padding: 18px 20px; }
.pfoot-in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.pfoot strong { display: block; color: #fff; font-size: 13.5px; }
.pfoot span { font-size: 12.5px; color: #8f99bd; }
.pfoot .contacts { margin: 0; }
.pfoot .btn.ghost { color: #fff; border-color: rgba(255, 255, 255, .25); }

.cn-main { flex: 1; display: flex; justify-content: center; padding: 34px 18px 48px; }
.cn-card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 26px 24px; align-self: flex-start; }
.cn-card h1 { font-size: 1.6rem; }
.cn-new { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-2); }

/* ---------- portail de l'atelier (disposition du portail AGV) ---------- */
.portail-page { min-height: 100vh; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; }
.portail-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 9px 18px; background: var(--indigo-950); color: #fff; }
.pb-g { display: flex; align-items: center; gap: 11px; min-width: 0; }
.pb-g img { height: 38px; width: auto; max-width: 120px; object-fit: contain; background: #fff; border-radius: 6px; padding: 3px; }
.pb-t strong { display: block; font-family: var(--display); font-size: 1rem; line-height: 1.15; }
.pb-t span { display: block; font-size: 11.5px; color: #8f99bd; }
.pb-qui { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #cbd2e8; }
.pb-qui .ic { width: 16px; height: 16px; }
.pb-out { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0; color: #f4b3b3; font: 600 13px var(--font); cursor: pointer; padding: 6px 4px; }
.pb-out .ic { width: 16px; height: 16px; }
.portail { background: var(--surface); border-bottom: 1px solid var(--line); padding: 26px 16px 30px; }
.portail-in { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 18px; justify-items: center; }
.tuile { position: relative; width: 100%; max-width: 236px; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 10px; padding: 20px 14px 16px; text-align: center; cursor: pointer; background: var(--surface); font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s, transform .15s; }
.tuile:hover { border-color: var(--vat); box-shadow: 0 6px 18px rgba(20, 27, 61, .10); transform: translateY(-2px); }
.tuile-rond { width: 56px; height: 56px; border-radius: 50%; margin-bottom: 8px; display: grid; place-items: center; background: var(--vat-50); color: var(--vat); }
.tuile-rond .ic { width: 27px; height: 27px; stroke-width: 1.6; }
.tuile-logo { width: 56px; height: 56px; object-fit: contain; margin-bottom: 8px; }
.tuile-t { font-family: var(--display); font-size: 14.5px; font-weight: 700; color: var(--indigo-700); }
.tuile-s { font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.tuile-g { font-size: 12px; color: var(--ink); font-weight: 600; margin-top: 2px; }
.tuile-tag { position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--gold-50); color: var(--gold-ink); }
.tuile.neuve { border-style: dashed; background: transparent; }
.tuile.neuve .tuile-rond { background: var(--gold-50); color: var(--gold-ink); }
.portail-corps { flex: 1; padding: 22px 16px 40px; }
.pc-in { max-width: 1040px; margin: 0 auto; }
.pc-table td, .pc-table th { white-space: nowrap; }
.band { display: flex; align-items: stretch; border-radius: var(--r-l); overflow: hidden; margin: 10px 0; border: 1px solid var(--line); background: var(--surface); }
.band-l { flex: 1; padding: 12px 16px; border-left: 6px solid var(--b, var(--vat)); }
.band-l strong { display: block; font-family: var(--display); font-size: 15px; margin-bottom: 6px; }
.band-blocs { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.band-blocs span { display: flex; flex-direction: column; font-weight: 600; font-size: 15px; }
.band-blocs small { font-size: 11px; color: var(--ink-3); font-weight: 600; }
.band-r { min-width: 210px; padding: 12px 16px; background: var(--indigo-900); color: #fff; display: flex; flex-direction: column; justify-content: center; }
.band-r small { color: #aab3d4; font-size: 12px; }
.band-r b { font-family: var(--display); font-size: 1.25rem; }
.band.dettes { --b: #b23a3a; } .band.creances { --b: #d9a21b; } .band.caisse { --b: #2f7d4f; } .band.mobile { --b: #d76d1c; } .band.banque { --b: #1d5a3a; }
.stock-boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.sbox { background: var(--indigo-800); color: #fff; border-radius: var(--r-l); padding: 12px 14px; }
.sbox small { display: block; color: #aab3d4; font-size: 12px; }
.sbox b { font-family: var(--display); font-size: 1.15rem; }
.sbox.tot { background: var(--gold); color: var(--indigo-950); }
.sbox.tot small { color: #5c3f0c; }

/* barre latérale : retour au portail, bloc ouvert */
.side-portail { display: flex; align-items: center; gap: 8px; margin: 10px 10px 0; padding: 8px 10px; border: 1px solid rgba(255, 255, 255, .14); border-radius: var(--r); background: transparent; color: #fff; font: 600 13.5px var(--font); cursor: pointer; }
.side-portail:hover { background: rgba(255, 255, 255, .08); }
.side-bloc { margin: 10px 10px 0; padding: 8px 12px; border-radius: var(--r); background: rgba(201, 147, 46, .14); border-left: 3px solid var(--gold); }
.side-bloc b { display: block; color: #f1d39a; font-size: 12px; letter-spacing: .03em; }
.side-bloc small { display: block; color: #fff; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* cases à cocher multiples (rôles, blocs) */
fieldset.checks { border: 1px solid var(--line); border-radius: var(--r-l); padding: 10px 14px 12px; margin: 0; }
fieldset.checks legend { font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 0 6px; }

.checks-grid .chk small { font-size: 12px; }

.cologin { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
.co-head { background: var(--indigo-900); color: #fff; text-align: center; padding: 34px 20px 26px; position: relative; overflow: hidden; }
.co-head::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background-color: var(--indigo-800); background-image: repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 22px, #f3f5fa 22px 24px, transparent 24px 36px); opacity: .9; }
.co-head h1 { color: #fff; margin: 12px 0 2px; }

.co-foot { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.note { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-l); margin-bottom: 14px; }
.note.warn { background: var(--warn-50); color: #5c3c08; }
.note p { margin: 2px 0 0; font-size: 13px; }

.regwrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 48px; }
.reg-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 20px; }
.regform { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 22px; }
.reg-actions { margin-top: 18px; }
.regwrap.done { text-align: center; max-width: 520px; }
.done-mark { width: 64px; height: 64px; margin: 10px auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-50); color: var(--ok); }
.done-mark .ic { width: 34px; height: 34px; }
.bigcode { font-family: "IBM Plex Mono", monospace; font-size: 2rem; font-weight: 700; letter-spacing: .1em; color: var(--indigo-700); background: var(--gold-50); border: 1px dashed var(--gold); border-radius: var(--r-l); padding: 14px; margin: 14px 0; }
.regwrap.done .kv { text-align: left; margin: 18px 0; }
.blocked { max-width: 560px; margin: 0 auto; padding: 48px 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.blk-pay { width: 100%; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 8px; }
.offres { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; width: 100%; }
.offre { border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.offre .prix { font-family: var(--display); font-size: 1.2rem; font-weight: 700; color: var(--indigo-700); }
.offre small { color: var(--ink-3); }

/* ---------- coque ---------- */
.app { display: block; }
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--indigo-900); color: #c9d0e6; display: flex; flex-direction: column; z-index: 40; padding-left: 7px; }
.side::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; }
.side-co { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; border-bottom: 1px solid rgba(255, 255, 255, .08); }
.side-co img { width: 36px; height: 36px; border-radius: 9px; object-fit: contain; background: #fff; }
.side-co strong { display: block; color: #fff; font-family: var(--display); font-size: 1rem; line-height: 1.15; }
.side-co span { font-size: 11.5px; color: #8f99bd; }
.side-nav { flex: 1; overflow-y: auto; padding: 8px 10px 14px; }
.ng { margin-top: 12px; }
.ng-t { display: block; font-size: 11.5px; color: #8f99bd; padding: 4px 10px; }
.ni { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); color: #d7dcee; text-decoration: none; font-weight: 500; position: relative; }
.ni:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.ni.on { background: rgba(255, 255, 255, .1); color: #fff; }
.ni.on::before { content: ""; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 2px; background: var(--gold); }
.ni-c { margin-left: auto; font-size: 11.5px; background: var(--gold); color: #24180a; border-radius: 10px; padding: 0 7px; font-weight: 700; }
.ni-c:empty { display: none; }
.side-foot { padding: 10px; border-top: 1px solid rgba(255, 255, 255, .08); }
.side-me { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: var(--r); background: transparent; color: #fff; cursor: pointer; text-align: left; font: inherit; }
.side-me:hover { background: rgba(255, 255, 255, .06); }
.side-me small { display: block; color: #8f99bd; font-size: 12px; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #24180a; font-weight: 700; flex: none; }
.side-scrim { display: none; }
.maincol { margin-left: var(--side-w); min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 22px; background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--line); }
.burger { display: none; }
.tb-title { font-family: var(--display); font-weight: 650; font-size: 1.05rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-right { display: flex; align-items: center; gap: 8px; }
.net { font-size: 12px; padding: 3px 9px; border-radius: 12px; font-weight: 600; }
.net.on { background: var(--ok-50); color: var(--ok); } .net.off { background: var(--err-50); color: var(--err); }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 22px; font-size: 13.5px; flex-wrap: wrap; }
.banner span { flex: 1; min-width: 200px; }
.banner.off { background: var(--err-50); color: #6d1f1f; } .banner.warn { background: var(--warn-50); color: #5c3c08; } .banner.info { background: var(--vat-50); color: var(--indigo-700); }
.main { flex: 1; padding: 20px 22px 60px; outline: none; }
.page { max-width: 1320px; margin: 0 auto; }
.loading { padding: 40px; text-align: center; color: var(--ink-3); }
.phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin: 6px 0 16px; }
.phead h1 { margin: 0 0 2px; }
.phead p { margin: 0; max-width: 72ch; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: -4px 0 18px; overflow-x: auto; scrollbar-width: thin; }
.tab { padding: 9px 14px; color: var(--ink-2); text-decoration: none; border: 0; border-bottom: 2px solid transparent; background: none; font: 500 14px var(--font); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--indigo-700); border-bottom-color: var(--gold); font-weight: 650; }
.tabs.sub { margin-top: 6px; }

/* ---------- blocs ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); margin-bottom: 16px; }
.card.pad { padding: 16px 18px; }
.card h2 { margin-bottom: .6em; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 0 0 16px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile[role=button] { cursor: pointer; } .tile[role=button]:hover { border-color: var(--vat); }
.tile > span { font-size: 12.5px; color: var(--ink-2); }
.tile strong { font-family: var(--display); font-size: 1.3rem; font-weight: 700; overflow-wrap: anywhere; }
.tile small { color: var(--ink-3); font-size: 12px; }
.tile.warn { border-color: #ecd3a3; background: var(--warn-50); }
.tile.gold { border-top: 3px solid var(--gold); }
.kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 14px; margin: 0 0 12px; }
.kv dt { color: var(--ink-3); font-size: 13px; } .kv dd { margin: 0; overflow-wrap: anywhere; }
.bdg { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.bdg.ok { background: var(--ok-50); color: var(--ok); } .bdg.warn { background: var(--warn-50); color: var(--warn); } .bdg.err { background: var(--err-50); color: var(--err); } .bdg.info { background: var(--vat-50); color: var(--vat); }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, .18); vertical-align: -1px; }
.chip { display: inline-block; font-size: 12px; background: var(--line-2); border-radius: 12px; padding: 1px 8px; margin: 1px 0; white-space: nowrap; }
.emptybox { text-align: center; padding: 40px 20px; border: 1px dashed var(--line); border-radius: var(--r-l); background: var(--surface); }
.emptybox p { color: var(--ink-2); max-width: 52ch; margin: 0 auto 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.mini { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); }
.mini.big { align-items: flex-start; flex-direction: column; }
.mcard { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.mcard:hover { border-color: var(--vat); }
.mcard img { width: 100%; height: 130px; object-fit: cover; }
.mcard-ph { height: 70px; display: flex; }
.mcard-ph span { flex: 1; }
.mcard-b { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.bar { height: 5px; background: var(--line-2); border-radius: 4px; overflow: hidden; margin-top: 4px; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--vat); }
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.step { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.step.done { border-color: #b9dcc6; background: var(--ok-50); } .step.run { border-color: #c4cff0; background: var(--vat-50); }
.photo { max-width: 160px; border-radius: var(--r); } .photo.big { max-width: 100%; }

/* ---------- tableaux ---------- */
.tbl { margin-bottom: 16px; }
.ttools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.tsearch { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid #cfd5e3; border-radius: var(--r); padding: 0 10px; flex: 1; min-width: 200px; max-width: 360px; color: var(--ink-3); }
.tsearch input { border: 0; padding: 8px 0; min-height: 38px; box-shadow: none; }
.ttools select { width: auto; min-height: 38px; padding: 7px 10px; }
.tscroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); }
.grid { width: 100%; border-collapse: collapse; font-size: 13.8px; }
.grid th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink-2); background: #f6f7fb; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.grid td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.grid tbody tr:last-child td { border-bottom: 0; }
.grid tbody tr:hover td { background: #f8f9fd; }
.grid tr.clk { cursor: pointer; }
.grid .num { text-align: right; white-space: nowrap; }
.grid .c { text-align: center; }
.grid td.act, .grid th.act { text-align: right; white-space: nowrap; width: 1%; }
.grid tfoot td { font-weight: 650; background: #f6f7fb; border-top: 1px solid var(--line); }
.grid td.empty { text-align: center; color: var(--ink-3); padding: 26px; }
.thsort { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
.thsort.on { color: var(--indigo-700); }
.pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 8px 2px; font-size: 13px; color: var(--ink-3); }
.card .tscroll, .modal .tscroll { border-radius: var(--r); }
.modal .grid { margin-bottom: 10px; border: 1px solid var(--line); border-radius: var(--r); }
.matrix td.c, .matrix th.c { text-align: center; }
.matrix th[scope=row] { white-space: nowrap; }
.lined td { padding: 5px 6px; } .lined input, .lined select { min-height: 36px; padding: 6px 8px; font-size: 14px; }
.lined .calc { display: block; padding: 8px 4px; font-weight: 600; }
.lfoot { text-align: right; font-weight: 500; }
.lines { margin-bottom: 8px; }
.lines > .btn { margin-top: 8px; }
.pres.P { color: var(--ok); font-weight: 700; } .pres.A { color: var(--err); font-weight: 700; } .pres.R { color: var(--warn); font-weight: 700; }
.period { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; font-size: 13.5px; color: var(--ink-2); }
.period label { display: flex; align-items: center; gap: 6px; }
.period input, .period select { width: auto; min-height: 36px; padding: 6px 9px; }

/* ---------- tableau de bord ---------- */
.dash-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.dash-head h1 { margin: 0; }
.dash-head p { margin: 2px 0 0; }
.sec { margin: 22px 0 10px; font-size: 1.05rem; color: var(--indigo-700); }
.alerts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.alerts.ok p { color: var(--ok); margin: 0; display: flex; gap: 8px; align-items: center; }
.alert { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 14px; border: 1px solid #ecd3a3; background: var(--warn-50); border-radius: var(--r-l); color: #5c3c08; cursor: pointer; font: inherit; }
.alert strong { display: block; } .alert small { display: block; color: #7a5a24; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--font); }
.chart .s0, .legend .s0 { fill: var(--vat); background: var(--vat); }
.chart .s1, .legend .s1 { fill: var(--gold); background: var(--gold); }
.legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ---------- rapports ---------- */
.rap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
.rap-list { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 6px; position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow-y: auto; }
.rap-i { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: var(--r); font: 14px var(--font); color: var(--ink-2); cursor: pointer; }
.rap-i:hover { background: var(--vat-50); color: var(--ink); }
.rap-i.on { background: var(--indigo-700); color: #fff; }
.rap-body h3 { margin-top: 16px; }

/* ---------- appel ---------- */
.appel { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.ap-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; font: 600 13px var(--font); cursor: pointer; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on.P { background: var(--ok); color: #fff; } .seg button.on.R { background: var(--warn); color: #fff; } .seg button.on.A { background: var(--err); color: #fff; }

/* ---------- fenêtres ---------- */
#modals { position: relative; z-index: 100; }
.mwrap { position: fixed; inset: 0; background: rgba(16, 22, 58, .48); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: var(--r-xl); width: 100%; box-shadow: 0 24px 60px rgba(16, 22, 58, .28); display: flex; flex-direction: column; max-height: none; }
.modal.s { max-width: 440px; } .modal.m { max-width: 600px; } .modal.l { max-width: 820px; } .modal.xl { max-width: 1100px; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.mhead h2 { margin: 0; font-size: 1.15rem; }
.mbody { padding: 4px 18px 16px; }
.mbody .intro { margin-top: 0; }
.mfoot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--line); background: #fafbfd; border-radius: 0 0 var(--r-xl) var(--r-xl); position: sticky; bottom: 0; }
#toasts { position: fixed; z-index: 200; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(92vw, 520px); pointer-events: none; }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--r-l); background: var(--indigo-900); color: #fff; box-shadow: 0 10px 30px rgba(16, 22, 58, .3); font-size: 14px; pointer-events: auto; transition: opacity .25s, transform .25s; }
.toast.ok { background: #1d5b38; } .toast.err { background: #8e2b2b; }
.toast.out { opacity: 0; transform: translateY(8px); }

/* ---------- espace concepteur ---------- */
.cc { min-height: 100vh; background: var(--bg); }
.cc-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--indigo-900); color: #fff; flex-wrap: wrap; }
.cc-title strong { display: block; font-family: var(--display); } .cc-title span { font-size: 12px; color: #8f99bd; }
.cc-tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.cc-tab { border: 0; background: transparent; color: #c9d0e6; padding: 8px 12px; border-radius: var(--r); font: 600 13.5px var(--font); cursor: pointer; }
.cc-tab.on { background: rgba(255, 255, 255, .12); color: #fff; box-shadow: inset 0 -2px 0 var(--gold); }
.cc-count { margin-left: 6px; background: var(--gold); color: #24180a; border-radius: 10px; padding: 0 6px; font-size: 11.5px; }
.cc-count:empty { display: none; }
.cc-top .btn { color: #fff; border-color: rgba(255, 255, 255, .25); }
.cc-main { max-width: 1320px; margin: 0 auto; padding: 20px; }
.cc-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 18px; }
.cc-stat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); cursor: pointer; font: inherit; color: inherit; }
.cc-stat strong { font-family: var(--display); font-size: 1.4rem; }
.cc-stat span { font-size: 12.5px; color: var(--ink-2); }
.cc-stat.on { border-color: var(--vat); box-shadow: inset 0 0 0 1px var(--vat); }

/* ---------- téléphone et tablette ---------- */
@media (max-width: 1100px) {
  .rap { grid-template-columns: 1fr; }
  .rap-list { position: static; flex-direction: row; flex-wrap: wrap; max-height: none; }
}
@media (max-width: 900px) {
  .side { transform: translateX(-100%); transition: transform .2s; box-shadow: none; }
  body.drawer .side { transform: none; box-shadow: 0 0 40px rgba(0, 0, 0, .35); }
  body.drawer .side-scrim { display: block; position: fixed; inset: 0; background: rgba(16, 22, 58, .45); z-index: 35; }
  .maincol { margin-left: 0; }
  .burger { display: inline-flex; }
  .topbar { padding: 0 12px; }
  .main { padding: 14px 12px 60px; }
  .banner { padding: 10px 12px; }
  .choices { grid-template-columns: 1fr; }
  .home-hero { padding: 30px 16px 40px; align-items: flex-start; }
  .lockup-img { width: 168px; }
  .home-line { font-size: 1rem; margin: 16px auto 22px; }
  .pbar-brand span { display: none; }
  .portail { padding: 18px 12px 22px; }
  .portail-in { grid-template-columns: 1fr 1fr; gap: 12px; }
  .tuile { padding: 30px 10px 14px; }
  .tuile-rond { width: 46px; height: 46px; }
  .band { flex-direction: column; }
  .band-r { min-width: 0; }
  .pb-qui { display: none; }
  .landing { grid-template-columns: 1fr; }
  .weave { min-height: 230px; padding: 24px 20px; }
  .weave-brand strong { font-size: 1.5rem; }
  .weave-line { font-size: 1rem; }
  .access { padding: 26px 18px 40px; align-items: flex-start; }
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  .fgrid, .fgrid.cols4, .two { grid-template-columns: minmax(0, 1fr); }
  .mwrap { padding: 0; align-items: stretch; }
  .modal, .modal.s, .modal.m, .modal.l, .modal.xl { max-width: none; border-radius: 0; min-height: 100%; }
  .mfoot { border-radius: 0; }

/* =====================================================================
   Firebase : initialisation, lecture en direct, écritures atomiques
   ===================================================================== */

var FB = {
  ready: false, app: null, auth: null, db: null, cfg: null,
  connected: false, everConnected: false,

  configOk: function () {
    var c = window.NERP_FIREBASE_CONFIG;
    return !!(c && c.apiKey && c.databaseURL && c.apiKey.indexOf('REMPLACER') < 0 && c.databaseURL.indexOf('REMPLACER') < 0);
  },

  init: function () {
    if (FB.ready) return true;
    if (typeof firebase === 'undefined' || !firebase.initializeApp) return false;
    FB.cfg = window.NERP_FIREBASE_CONFIG;
    FB.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB.cfg);
    FB.auth = firebase.auth();
    FB.db = firebase.database();
    try { FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
    FB.db.ref('.info/serverTimeOffset').on('value', function (s) { FB.offset = Number(s.val()) || 0; });
    FB.db.ref('.info/connected').on('value', function (s) {
      FB.connected = !!s.val();
      if (FB.connected) FB.everConnected = true;
      S.online = FB.connected;
      Bus.emit('online', FB.connected);
    });
    FB.ready = true;
    return true;
  },

  offset: 0,
  now: function () { return Date.now() + (FB.offset || 0); },
  ref: function (p) { return FB.db.ref(p); },
  tref: function (p) { p = FB.bp(p); return FB.db.ref('t/' + S.tid + (p ? '/' + p : '')); },
  /* Données d'un bloc : le BLOC A reste à t/<tid>/d (données d'origine),
     les blocs suivants vivent à t/<tid>/blocs/<X>/d. Tout chemin « d/… »
     de l'application est redirigé ici vers le bloc ouvert. */
  bp: function (p) {
    if (!p || !S.bloc || S.bloc === 'A') return p;
    if (p === 'd' || p.indexOf('d/') === 0) return 'blocs/' + S.bloc + '/' + p;
    return p;
  },
  TS: function () { return firebase.database.ServerValue.TIMESTAMP; },
  inc: function (n) { return firebase.database.ServerValue.increment(n); },
  newId: function () { return FB.db.ref('t').push().key; },

  withTimeout: function (p, ms, label) {
    return new Promise(function (res, rej) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; rej(new Error('Le serveur ne répond pas (' + label + '). Vérifiez la connexion Internet.')); } }, ms);
      p.then(function (v) { if (!done) { done = true; clearTimeout(t); res(v); } },
        function (e) { if (!done) { done = true; clearTimeout(t); rej(e); } });
    });
  },
  get: function (path, ms) {
    return FB.withTimeout(FB.db.ref(path).once('value'), ms || 15000, 'lecture').then(function (s) { return s.val(); });
  },

  /* Compte secondaire : crée un utilisateur sans déconnecter l'administrateur. */
  secondaryAuth: function () {
    var name = 'nerp-secondaire';
    var app = firebase.apps.filter(function (a) { return a.name === name; })[0] || firebase.initializeApp(FB.cfg, name);
    var a = app.auth();
    try { a.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) {}
    return a;
  },

  /* Messages d'erreur Firebase en français, sans jargon. */
  errMsg: function (e) {
    var c = (e && (e.code || e.message)) || String(e);
    var map = {
      'auth/wrong-password': 'Mot de passe incorrect.',
      'auth/invalid-credential': 'Identifiant ou mot de passe incorrect.',
      'auth/invalid-login-credentials': 'Identifiant ou mot de passe incorrect.',
      'auth/user-not-found': 'Identifiant ou mot de passe incorrect.',
      'auth/user-disabled': 'Ce compte est désactivé.',
      'auth/too-many-requests': 'Trop de tentatives. Patientez quelques minutes avant de réessayer.',
      'auth/network-request-failed': 'Pas de connexion Internet. Vérifiez le réseau puis réessayez.',
      'auth/email-already-in-use': 'Cet identifiant est déjà utilisé.',
      'auth/weak-password': 'Mot de passe trop court : 6 caractères au minimum.',
      'auth/invalid-email': 'Adresse email invalide.',
      'auth/requires-recent-login': 'Par sécurité, reconnectez-vous avant cette opération.',
      'PERMISSION_DENIED': "Opération refusée par le serveur : vous n'avez pas les droits nécessaires, ou l'espace n'est plus actif.",
      'permission_denied': "Opération refusée par le serveur : vous n'avez pas les droits nécessaires, ou l'espace n'est plus actif."
    };
    for (var k in map) { if (String(c).indexOf(k) >= 0) return map[k]; }
    return (e && e.message) ? e.message : String(e);
  }
};

/* =====================================================================
   Collections en direct : chaque vue déclare ce dont elle a besoin.
   Les données restent écoutées pendant toute la session.
   ===================================================================== */
var Data = {
  subs: {},
  waiters: {},

  /* chemins relatifs à t/<tid>/d/ — sauf 'params', 'roles', 'members', 'info' */
  fullPath: function (p) {
    if (/^(params|roles|members|info|support|audit|fichiers|compteurs|supportLog|blocsInfo)$/.test(p)) return p;
    return 'd/' + p;
  },

  need: function (paths) {
    var ps = (paths || []).filter(Boolean).map(function (p) { return typeof p === 'string' ? Data.listen(p) : Data.range(p.path, p.field, p.start, p.end); });
    return Promise.all(ps);
  },

  /* Collection volumineuse : on n'écoute qu'une période (champ date). */
  rangeKey: function (path, field, start, end) { return path + '@' + field + ':' + (start || '') + ':' + (end || ''); },
  range: function (path, field, start, end) {
    var key = Data.rangeKey(path, field, start, end);
    if (Data.subs[key]) return Data.subs[key].promise;
    var q = FB.tref(Data.fullPath(path)).orderByChild(field);
    if (start) q = q.startAt(start);
    if (end) q = q.endAt(end);
    return Data.listen(key, q);
  },
  rows: function (path, field, start, end) { return vals(S.d[Data.rangeKey(path, field, start, end)] || {}); },

  listen: function (p, query) {
    if (Data.subs[p]) return Data.subs[p].promise;
    var entry = { ref: query || FB.tref(Data.fullPath(p)), promise: null, error: null };
    Data.subs[p] = entry;
    entry.promise = new Promise(function (resolve) {
      var first = true;
      entry.cb = function (snap) {
        S.d[p] = snap.val() || {};
        S.loaded[p] = true;
        if (first) { first = false; resolve(); }
        Bus.emit('data', p);
      };
      entry.err = function (e) {
        entry.error = e;
        S.d[p] = S.d[p] || {};
        S.loaded[p] = 'denied';
        console.warn('[NERP] lecture refusée', p, e && e.code);
        /* écoute coupée en cours de session : les droits ont changé */
        if (!first) Bus.emit('denied', p);
        if (first) { first = false; resolve(); }
      };
      entry.ref.on('value', entry.cb, entry.err);
    });
    return entry.promise;
  },

  stopAll: function () {
    Object.keys(Data.subs).forEach(function (p) { try { Data.subs[p].ref.off('value', Data.subs[p].cb); } catch (e) {} });
    Data.subs = {}; S.d = {}; S.loaded = {};
  }
};

/* =====================================================================
   Numérotation des documents : compteur par entreprise, type et année.
   ===================================================================== */
function nextNum(type, dateIso) {
  if (!S.online) return Promise.reject(new Error('Connexion Internet requise pour attribuer un numéro.'));
  var y = yearOf(dateIso || today());
  var key = type + '-' + y;
  return FB.withTimeout(FB.tref('compteurs/' + key).transaction(function (c) { return (c || 0) + 1; }), 20000, 'numérotation')
    .then(function (res) {
      if (!res.committed) throw new Error('Numérotation impossible, réessayez.');
      var n = res.snapshot.val();
      var pref = (S.params.prefixes && S.params.prefixes[type]) || PREFIXES_DEFAUT[type] || type;
      return pref + '-' + y + '-' + String(n).padStart(PAD[type] || 4, '0');
    });
}

/* =====================================================================
   Transaction d'écriture : tout part en une seule mise à jour atomique.
   Les quantités et soldes ne sont jamais écrits « en dur » : on ajoute un
   mouvement et on incrémente le solde dans la même écriture.
   ===================================================================== */
function Tx(label) {
  this.label = label || 'enregistrement';
  this.patch = {};
  this.delta = {};       /* variations locales de stock, pour les contrôles en cours de transaction */
  this.ids = {};
}
Tx.prototype.set = function (path, value) { this.patch[path] = value; return this; };
Tx.prototype.doc = function (colPath, id, value) { this.patch['d/' + colPath + '/' + id] = value; return this; };
Tx.prototype.field = function (colPath, id, field, value) { this.patch['d/' + colPath + '/' + id + '/' + field] = value; return this; };
Tx.prototype.inc = function (path, n) {
  if (!n) return this;
  var cur = this.patch[path];
  if (cur && cur['.sv'] && cur['.sv'].increment !== undefined) n += cur['.sv'].increment;
  this.patch[path] = FB.inc(n);
  return this;
};

/* solde disponible d'un article/lot/emplacement, en tenant compte de la transaction en cours */
function soldeOf(art, lot, emp) {
  var s = col('stock/soldes');
  var x = s[art] && s[art][lot || '_'] && s[art][lot || '_'][emp];
  return { q: x ? Number(x.q) || 0 : 0, v: x ? Number(x.v) || 0 : 0 };
}
Tx.prototype.soldeLocal = function (art, lot, emp) {
  var b = soldeOf(art, lot, emp), k = art + '|' + (lot || '_') + '|' + emp, d = this.delta[k] || { q: 0, v: 0 };
  return { q: b.q + d.q, v: b.v + d.v };
};
Tx.prototype._bump = function (art, lot, emp, dq, dv) {
  var k = art + '|' + lot + '|' + emp;
  var d = this.delta[k] || (this.delta[k] = { q: 0, v: 0 });
  d.q += dq; d.v += dv;
  this.inc('d/stock/soldes/' + art + '/' + lot + '/' + emp + '/q', dq);
  this.inc('d/stock/soldes/' + art + '/' + lot + '/' + emp + '/v', dv);
};

/* Valeur d'une sortie : coût du lot, sinon coût moyen pondéré de l'emplacement.
   Si toute la quantité restante sort, toute la valeur restante sort aussi. */
Tx.prototype.valeurSortie = function (art, lot, emp, q) {
  var s = this.soldeLocal(art, lot, emp);
  if (s.q <= 0) return 0;
  if (q >= s.q) return s.v;
  if (lot && lot !== '_') {
    var L = get('stock/lots', lot);
    if (L && L.cu !== undefined && L.cu !== null) return Math.min(s.v, Math.round(fromQ(q) * Number(L.cu)));
  }
  return Math.round(s.v * q / s.q);
};

/* Mouvement de stock.
   m = { type, art, lot, q, from, to, val, src, doc:{t,id,n}, motif, date, cu, extra }
   - entrée  : to seul, val = coût d'entrée
   - sortie  : from seul, valeur calculée
   - transfert : from et to, la valeur suit la marchandise                  */
Tx.prototype.mvt = function (m) {
  var lot = m.lot || '_';
  if (!m.art) throw new Error('Article manquant dans le mouvement.');
  if (!(m.q > 0)) throw new Error('Quantité invalide pour ' + artName(m.art) + '.');
  var val;
  if (m.from) {
    var dispo = this.soldeLocal(m.art, lot, m.from).q;
    var art = articleOf(m.art) || {};
    if (dispo < m.q && !art.negOk && !m.forceNeg) {
      throw new Error('Stock insuffisant : ' + artName(m.art) + (lot !== '_' ? ' (lot ' + lotNum(lot) + ')' : '') +
        ' dans « ' + empName(m.from) + ' » — disponible ' + fmtQ(dispo, artUnit(m.art)) + ', demandé ' + fmtQ(m.q, artUnit(m.art)) + '.');
    }
    val = m.val !== undefined ? Math.round(m.val) : this.valeurSortie(m.art, lot, m.from, m.q);
    this._bump(m.art, lot, m.from, -m.q, -val);
  } else {
    val = Math.round(m.val || 0);
  }
  if (m.to) this._bump(m.art, lot, m.to, m.q, val);
  var id = m.id || FB.newId();
  var rec = {
    type: m.type, art: m.art, lot: lot, q: m.q, val: val,
    from: m.from || null, to: m.to || null,
    src: m.src, date: m.date || today(), ts: FB.TS(), par: S.user.uid, parNom: S.member.nom,
    doc: m.doc || null, motif: m.motif || null
  };
  if (m.extra) Object.keys(m.extra).forEach(function (k) { rec[k] = m.extra[k]; });
  this.patch['d/stock/mvts/' + id] = rec;
  return { id: id, val: val };
};

/* Opération de trésorerie : une entrée ou une sortie, rattachée à un document. */
Tx.prototype.op = function (o) {
  if (!o.compte) throw new Error('Choisissez la caisse ou le compte.');
  if (!(o.montant > 0)) throw new Error('Le montant doit être supérieur à zéro.');
  var id = o.id || FB.newId();
  var date = o.date || today();
  this.patch['d/finances/ops/' + id] = {
    compte: o.compte, sens: o.sens, montant: Math.round(o.montant), date: date, mois: monthOf(date),
    cat: o.cat || null, centre: o.centre || null, src: o.src, doc: o.doc || null,
    libelle: o.libelle || '', tiers: o.tiers || null, recu: o.recu || null, ref: o.ref || null,
    ts: FB.TS(), par: S.user.uid, parNom: S.member.nom, annule: o.annule || null
  };
  this.inc('d/finances/soldes/' + o.compte, o.sens === 'e' ? Math.round(o.montant) : -Math.round(o.montant));
  return id;
};

Tx.prototype.audit = function (action, objet, ref, extra) {
  var id = FB.newId();
  var a = { ts: FB.TS(), uid: S.user.uid, nom: S.member.nom, action: action, objet: objet || null, ref: ref || null, bloc: S.bloc || 'A' };
  if (extra) ['avant', 'apres', 'motif', 'detail'].forEach(function (k) { if (extra[k] !== undefined) a[k] = extra[k]; });
  this.patch['audit/' + id] = a;
  return this;
};

Tx.prototype.commit = function () {
  var self = this;
  if (!S.online) return Promise.reject(new Error("Pas de connexion Internet : rien n'a été enregistré. Réessayez dès le retour du réseau."));
  if (!Object.keys(this.patch).length) return Promise.resolve();
  Object.keys(this.patch).forEach(function (k) { if (self.patch[k] === undefined) self.patch[k] = null; });
  /* chemins de données redirigés vers le bloc ouvert */
  if (S.bloc && S.bloc !== 'A') {
    var mapped = {};
    Object.keys(this.patch).forEach(function (k) { mapped[FB.bp(k)] = self.patch[k]; });
    this.patch = mapped;
  }
  /* Firebase refuse une mise à jour qui écrit à la fois un nœud et l'un de ses
     enfants : on replie l'enfant dans l'objet parent. */
  var keys = Object.keys(this.patch).sort();
  var clean = {};
  keys.forEach(function (k) {
    var parts = k.split('/'), host = null, rest = null;
    for (var i = parts.length - 1; i > 0; i--) {
      var anc = parts.slice(0, i).join('/');
      if (Object.prototype.hasOwnProperty.call(clean, anc)) { host = anc; rest = parts.slice(i); break; }
    }
    if (host === null) { clean[k] = self.patch[k]; return; }
    if (!clean[host] || typeof clean[host] !== 'object') clean[host] = {};
    var o = clean[host];
    for (var j = 0; j < rest.length - 1; j++) { if (!o[rest[j]] || typeof o[rest[j]] !== 'object') o[rest[j]] = {}; o = o[rest[j]]; }
    o[rest[rest.length - 1]] = self.patch[k];
  });
  return FB.withTimeout(FB.tref().update(clean), 25000, this.label);
};

/* Exécute une opération avec bouton occupé, message et gestion d'erreur. */
function runOp(btn, fn, okMsg) {
  if (btn && btn.dataset.busy === '1') return Promise.resolve(false);
  var label = btn ? btn.innerHTML : '';
  if (btn) { btn.dataset.busy = '1'; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Enregistrement…'; }
  return Promise.resolve().then(fn).then(function (r) {
    if (okMsg) UI.toast(typeof okMsg === 'function' ? okMsg(r) : okMsg, 'ok');
    return r === undefined ? true : r;
  }).catch(function (e) {
    console.error('[NERP]', e);
    UI.toast(FB.errMsg(e), 'err', 7000);
    return false;
  }).then(function (r) {
    if (btn && document.body.contains(btn)) { btn.dataset.busy = ''; btn.disabled = false; btn.innerHTML = label; }
    return r;
  });
}

function lotNum(id) { var L = get('stock/lots', id); return L ? L.num : (id === '_' ? '' : id); }

  download: function (name, mime, content) {

    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();

  exportCSV: function (name, headers, rows) {
    var q = function (v) { v = v === null || v === undefined ? '' : String(v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var txt = '﻿' + [headers.map(q).join(';')].concat(rows.map(function (r) { return r.map(q).join(';'); })).join('\r\n');
    UI.download(name + '.csv', 'text/csv;charset=utf-8', txt);
  },
  exportXLS: function (name, headers, rows) {
    var cell = function (v) {
      if (typeof v === 'number' && isFinite(v)) return '<Cell><Data ss:Type="Number">' + v + '</Data></Cell>';
      return '<Cell><Data ss:Type="String">' + esc(v === null || v === undefined ? '' : v) + '</Data></Cell>';
    };
    var xml = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>' +
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
      '<Styles><Style ss:ID="h"><Font ss:Bold="1"/></Style></Styles><Worksheet ss:Name="' + esc(name.slice(0, 30)) + '"><Table>' +
      '<Row>' + headers.map(function (h) { return '<Cell ss:StyleID="h"><Data ss:Type="String">' + esc(h) + '</Data></Cell>'; }).join('') + '</Row>' +
      rows.map(function (r) { return '<Row>' + r.map(cell).join('') + '</Row>'; }).join('') + '</Table></Worksheet></Workbook>';

/* =====================================================================
   Création d'un espace : une seule écriture atomique.
   byAdmin = vrai quand le concepteur crée l'espace d'un client.
   ===================================================================== */
var Tenant = {
  create: function (v, byAdmin) {
    var pub = Platform.p();
    var code, tid = 't' + FB.newId().replace(/[^A-Za-z0-9_-]/g, '');
    var ownerUid, email;
    var tryCode = function (n) {
      code = genTenantCode();
      return FB.get('codes/' + code).then(function (x) { if (x) { if (n > 5) throw new Error('Réessayez.'); return tryCode(n + 1); } });
    };
    var authInst = byAdmin ? FB.secondaryAuth() : FB.auth;
    return tryCode(0).then(function () {
      email = authEmail(code, v.ident);
      if (!byAdmin) try { FB.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (x) {}
      return FB.withTimeout(authInst.createUserWithEmailAndPassword(email, v.pwd), 20000, 'création du compte');
    }).then(function (cred) {
      ownerUid = cred.user.uid;
      var days = byAdmin && v.jours ? v.jours : (Number(pub.essaiJours) || 60);
      var fin = FB.now() + days * 86400000;
      var nomOwner = (v.prenom + ' ' + v.nomp).trim();
      var patch = {};
      patch['codes/' + code] = tid;
      patch['tenants/' + tid] = {
        nom: v.nom, code: code, owner: ownerUid, ownerNom: nomOwner, ownerIdent: v.ident, tel: v.tel || '', email: v.email || '', ville: v.ville || '',
        etat: byAdmin && v.etat ? v.etat : 'essai', offre: byAdmin && v.offre ? v.offre : 'essai', offreNom: byAdmin && v.offreNom ? v.offreNom : 'Essai',
        creeLe: FB.TS(), fin: fin, finAcces: fin, grace: 0,
        maxUsers: byAdmin && v.maxUsers ? Number(v.maxUsers) : Math.min(10, Number(pub.essaiMaxUsers) || 5), nbUsers: 1
      };
      patch['tenantsPub/' + tid] = { nom: v.nom, code: code, ville: v.ville || '', logo: v.logo || '', etat: patch['tenants/' + tid].etat, finAcces: fin };
      var T = 't/' + tid + '/';
      patch[T + 'members/' + ownerUid] = { ident: v.ident, nom: nomOwner, role: 'proprietaire', actif: true, tel: v.tel || '', poste: 'Propriétaire', creeLe: FB.TS() };
      patch[T + 'loginIndex/' + v.ident] = { e: email, uid: ownerUid };
      var roles = rolesParDefaut();
      Object.keys(roles).forEach(function (rid) { patch[T + 'roles/' + rid] = roles[rid]; });
      patch[T + 'info'] = {
        raisonSociale: v.nom, ville: v.ville || '', tel: v.tel || '', email: v.email || '', logo: v.logo || '', adresse: '', couleur: '#22306b', devise: 'GNF',
        piedPage: v.nom + (v.ville ? ' — ' + v.ville : '') + (v.tel ? ' — ' + v.tel : '')
      };
      var params = { prefixes: PREFIXES_DEFAUT, regles: { remiseMax: 10, validateurUnique: true, delaiPaiement: 30, presenceMin: 75, moyenneMin: 10, soldeAttestation: true } };
      [['emplacements', EMPLACEMENTS_DEFAUT], ['unites', UNITES_DEFAUT], ['categories', CATEGORIES_DEFAUT], ['couleurs', COULEURS_DEFAUT],
        ['centres', CENTRES], ['catDepenses', CAT_DEPENSES_DEFAUT], ['typesControle', TYPES_CONTROLE_DEFAUT], ['etapes', ETAPES_DEFAUT]].forEach(function (p) {
        var o = {}; p[1].forEach(function (x) { o[x.id] = clone(x); delete o[x.id].id; }); params[p[0]] = o;
      });
      params.sites = { principal: { nom: 'Site principal', ville: v.ville || '' } };
      patch[T + 'params'] = params;
      return FB.withTimeout(FB.ref().update(patch), 25000, "création de l'espace").then(function () {
        if (byAdmin) {
          /* comptes de trésorerie de départ, écrits par le propriétaire à sa première connexion */
          try { authInst.signOut(); } catch (x) {}
        }
        return { tid: tid, code: code, nom: v.nom, ident: v.ident, fin: fin, uid: ownerUid };
      }).catch(function (e) {
        /* l'espace n'a pas pu être écrit : on retire le compte pour permettre un nouvel essai */
        try { var u = authInst.currentUser; if (u) u.delete(); } catch (x) {}
        throw e;
      });
    });
  }
};

  /* ------------------------------------------------------------------ */
  openLogin: function () {
    if (!FB.ready) { UI.toast('Connexion au serveur en cours, réessayez dans un instant.', 'err'); return; }
    var left = Device.lockLeft();
    var m = UI.modal({
      title: 'Espace concepteur', size: 's',
      body: '<form id="cc-form" class="stack" novalidate>' +
        '<label class="fld"><span>Email</span><input id="cc-email" type="email" autocomplete="username"></label>' +
        '<label class="fld"><span>Mot de passe</span><input id="cc-pwd" type="password" autocomplete="current-password"></label>' +
        '<p class="ferr" id="cc-err" role="alert">' + (left ? 'Trop de tentatives. Réessayez dans ' + left + ' s.' : '') + '</p></form>' +
        '<p class="small"><button type="button" class="linkbtn" data-mact="reset">Mot de passe oublié</button> · <button type="button" class="linkbtn" data-mact="install">Première installation</button></p>',
      actions: [{ t: 'Annuler', act: 'cancel', cls: 'ghost' }, { t: 'Accéder', act: 'go', cls: 'primary' }],
      onOpen: function (mm) { $('#cc-form', mm.el).addEventListener('submit', function (e) { e.preventDefault(); go(); }); },
      onAct: function (act) {
        if (act === 'cancel') m.close();
        else if (act === 'go') go();
        else if (act === 'reset') reset();
        else if (act === 'install') { m.close(); Concepteur.install(); }
      }
    });
    function go() {
      var email = $('#cc-email', m.el).value.trim(), pwd = $('#cc-pwd', m.el).value, err = $('#cc-err', m.el);
      if (Device.lockLeft()) { err.textContent = 'Trop de tentatives. Réessayez dans ' + Device.lockLeft() + ' s.'; return; }
      if (!email || !pwd) { err.textContent = 'Saisissez votre email et votre mot de passe.'; return; }
      m.busy('go', true);
      try { FB.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch (x) {}
      sessionStorage.setItem('nerp_mode', 'concepteur');
      FB.withTimeout(FB.auth.signInWithEmailAndPassword(email, pwd), 20000, 'connexion').then(function (c) {
        return FB.get('platform/admins/' + c.user.uid).then(function (a) {
          if (!a) { FB.auth.signOut(); throw new Error("Ce compte n'est pas un compte concepteur."); }
          Device.ok(); m.close(); Concepteur.start(c.user, a);
        });
      }).catch(function (e) {
        sessionStorage.removeItem('nerp_mode');
        if (e && e.code && /auth\//.test(e.code)) Device.fail();
        err.textContent = FB.errMsg(e); m.busy('go', false);
      });
    }
    function reset() {
      var email = $('#cc-email', m.el).value.trim(), err = $('#cc-err', m.el);
      if (!email) { err.textContent = 'Saisissez d\'abord votre email.'; return; }
      FB.auth.sendPasswordResetEmail(email).then(function () { UI.toast('Email de réinitialisation envoyé à ' + email + '.', 'ok'); })
        .catch(function (e) { err.textContent = FB.errMsg(e); });
    }
  },

  /* Première installation : crée le compte concepteur avec la clé
     d'installation (fournie avec les règles de la base). */
  install: function () {
    UI.formModal({
      title: 'Installer le compte concepteur', size: 's',
      intro: 'Une seule fois, à la mise en service. La clé d\'installation figure dans le guide de déploiement.',
      fields: [
        { k: 'nom', t: 'Votre nom', req: true },
        { k: 'email', t: 'Email', type: 'email', req: true, help: 'Servira à réinitialiser votre mot de passe.' },
        { k: 'pwd', t: 'Mot de passe', type: 'password', req: true, valid: function (v) { return v && v.length < 8 ? '8 caractères au minimum.' : null; } },
        { k: 'pwd2', t: 'Confirmer', type: 'password', req: true, valid: function (v, o) { return v !== o.pwd ? 'Différent du mot de passe.' : null; } },
        { k: 'cle', t: "Clé d'installation", req: true, ph: 'NERP-XXXXX-XXXXX-XXXXX' }
      ],
      ok: 'Installer',
      save: function (v) {
        try { FB.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch (x) {}
        return FB.auth.createUserWithEmailAndPassword(v.email, v.pwd).catch(function (e) {
          if (e && e.code === 'auth/email-already-in-use') return FB.auth.signInWithEmailAndPassword(v.email, v.pwd);
          throw e;
        }).then(function (c) {
          return FB.withTimeout(FB.ref('platform/admins/' + c.user.uid).set({ email: v.email, nom: v.nom, depuis: FB.TS(), cle: v.cle.trim().toUpperCase() }), 20000, 'installation')
            .catch(function (e) { FB.auth.signOut(); throw new Error("Installation refusée : clé incorrecte, ou un compte concepteur existe déjà."); })
            .then(function () { return FB.ref('platform/public').once('value'); })
            .then(function (s) {
              var init = {};
              if (!s.exists()) init['platform/public'] = Object.assign({}, Platform.defaults, { concepteur: v.nom, publierTarifs: true });
              OFFRES_DEFAUT.forEach(function (o) { var x = clone(o); delete x.id; init['platform/offres/' + o.id] = x; });
              return FB.ref().update(init).then(function () { sessionStorage.setItem('nerp_mode', 'concepteur'); return FB.get('platform/admins/' + c.user.uid); })
                .then(function (a) { Concepteur.start(c.user, a); });
            });
        });
      },
      okMsg: 'Compte concepteur installé.'
    });
  },

  /* ------------------------------------------------------------------ */
  start: function (user, admin) {
    Concepteur.me = { uid: user.uid, email: user.email, nom: (admin && admin.nom) || user.email };
    S.admin = true;
    Concepteur.render();
    Concepteur.listen();
  },
  listen: function () {
    Concepteur.stop();
    var on = function (path, key) {
      var r = FB.ref(path);
      var cb = function (s) { Concepteur[key] = s.val() || {}; Concepteur.loaded[key] = true; Concepteur.refresh(); };
      r.on('value', cb, function (e) { console.warn('[concepteur]', path, e && e.code); });
      Concepteur.refs.push([r, cb]);
    };
    Concepteur.loaded = {};
    on('tenants', 'tenants'); on('platform/offres', 'offres'); on('platform/declarations', 'decl'); on('platform/paiements', 'paie');
    on('platform/public', 'pub'); on('platform/journal', 'jrn');
  },
  stop: function () { Concepteur.refs.forEach(function (x) { try { x[0].off('value', x[1]); } catch (e) {} }); Concepteur.refs = []; },
  logout: function () {
    Concepteur.stop(); S.admin = false; sessionStorage.removeItem('nerp_mode');
    FB.auth.signOut().then(function () { Landing.render(); });
  },
  journal: function (action, cible, detail) {
    var id = FB.newId();
    return FB.ref('platform/journal/' + id).set({ ts: FB.TS(), par: Concepteur.me.uid, parNom: Concepteur.me.nom, action: action, cible: cible || null, detail: detail || null }).catch(function () {});
  },

  etat: function (t) {
    var now = FB.now();
    if (t.etat === 'archive') return 'archive';
    if (t.etat === 'suspendu') return 'suspendu';
    if (!t.finAcces || t.finAcces < now) return 'expire';
    if (t.fin < now) return 'grace';
    return t.etat === 'essai' ? 'essai' : 'actif';
  },
  joursRestants: function (t) { return t.finAcces ? Math.ceil((t.finAcces - FB.now()) / 86400000) : 0; },

  render: function () {
    var el = $('#scr-concepteur');
    el.innerHTML = '<div class="cc">' +
      '<header class="cc-top">' + Brand.mark(34) + '<div class="cc-title"><strong>Espace concepteur</strong><span>' + esc(Concepteur.me.nom) + '</span></div>' +
      '<nav class="cc-tabs" role="tablist">' + [['entreprises', 'Ateliers'], ['paiements', 'Paiements'], ['offres', 'Offres et tarifs'], ['reglages', 'Réglages'], ['journal', 'Journal']].map(function (t) {
        return '<button type="button" role="tab" class="cc-tab' + (Concepteur.tab === t[0] ? ' on' : '') + '" data-cct="' + t[0] + '">' + t[1] + (t[0] === 'paiements' ? '<span class="cc-count" id="cc-ndecl"></span>' : '') + '</button>';
      }).join('') + '</nav>' +
      '<button type="button" class="btn ghost sm" id="cc-out">' + icon('logout') + ' Quitter</button></header>' +
      '<main class="cc-main" id="cc-main"><p class="muted">Chargement…</p></main></div>';
    Screens.show('scr-concepteur');
    $('#cc-out').addEventListener('click', Concepteur.logout);
    $$('[data-cct]', el).forEach(function (b) { b.addEventListener('click', function () { Concepteur.tab = b.dataset.cct; $$('[data-cct]', el).forEach(function (x) { x.classList.toggle('on', x === b); }); Concepteur.refresh(true); }); });
    $('#cc-main').addEventListener('click', Concepteur.onClick);
  },

  refresh: function (force) {
    var main = $('#cc-main'); if (!main) return;
    if (UI.stack.length && !force) { Concepteur.pending = true; return; }
    var n = vals(Concepteur.decl).filter(function (d) { return d.statut === 'attente'; }).length;
    var c = $('#cc-ndecl'); if (c) c.textContent = n ? n : '';
    var html = Concepteur['v_' + Concepteur.tab]();
    main.innerHTML = html;
  },

    var stats = [['', 'Toutes', count('')], ['essai', "En essai", count('essai')], ['actif', 'Actives', count('actif')], ['grace', 'En délai de grâce', count('grace')], ['expire', 'Expirées', count('expire')], ['suspendu', 'Suspendues', count('suspendu')]];
    var rows = all.filter(function (t) { return !Concepteur.filtre || t._etat === Concepteur.filtre; });

    }).join('') + '</div>' +

      UI.table({

          { k: 'nom', t: 'Entreprise', f: function (t) { return '<strong>' + esc(t.nom) + '</strong><br><small class="muted">' + esc(t.ville || '') + '</small>'; } },
          { k: 'ownerNom', t: 'Propriétaire', f: function (t) { return esc(t.ownerNom || '') + '<br><small class="muted">' + esc(t.tel || '') + '</small>'; }, sv: function (t) { return (t.ownerNom || '') + ' ' + (t.tel || ''); } },
          { k: '_etat', t: 'État', f: function (t) { return Concepteur.badge(t._etat); } },

        empty: 'Aucun atelier inscrit pour le moment.'
      });

          { k: 'tnom', t: 'Entreprise' }, { k: 'offreNom', t: 'Formule' }, { k: 'jours', t: 'Durée', num: true, f: function (p) { return plural(p.jours || 0, 'jour'); } },

  onClick: function (e) {

    'add-admin': function () {

        fields: [{ k: 'nom', t: 'Nom', req: true }, { k: 'email', t: 'Email', type: 'email', req: true }, { k: 'pwd', t: 'Mot de passe provisoire', type: 'password', req: true, valid: function (v) { return v && v.length < 8 ? '8 caractères au minimum.' : null; } }],

          });

/* Lots disponibles d'un article dans un emplacement (avec quantité). */
function lotsDispo(art, emp, filter) {
  var s = col('stock/soldes')[art] || {};
  var out = [];
  Object.keys(s).forEach(function (lot) {
    Object.keys(s[lot] || {}).forEach(function (e) {
      if (emp && e !== emp) return;
      var q = Number(s[lot][e].q) || 0;
      if (q <= 0) return;
      var L = lot === '_' ? null : get('stock/lots', lot);
      if (filter && !filter(L, lot, e)) return;
      out.push({ lot: lot, emp: e, q: q, v: Number(s[lot][e].v) || 0, L: L });
    });
  });
  return out.sort(function (a, b) { return String(a.L ? a.L.num : '').localeCompare(String(b.L ? b.L.num : '')); });
}
/* Quantités d'un article : par emplacement, total, disponible (emplacements utilisables). */
function stockArticle(art) {
  var s = col('stock/soldes')[art] || {};
  var r = { total: 0, valeur: 0, dispo: 0, parEmp: {} };
  var empsDispo = {}; plist('emplacements', EMPLACEMENTS_DEFAUT).forEach(function (e) { empsDispo[e.id] = e.dispo !== false; });
  Object.keys(s).forEach(function (lot) {
    Object.keys(s[lot] || {}).forEach(function (e) {
      var q = Number(s[lot][e].q) || 0, v = Number(s[lot][e].v) || 0;
      r.total += q; r.valeur += v; r.parEmp[e] = (r.parEmp[e] || 0) + q;
      if (empsDispo[e] !== false) r.dispo += q;
    });
  });
  return r;
}
function lotQty(lot) {
  var L = get('stock/lots', lot); if (!L) return { total: 0, parEmp: {} };
  var s = (col('stock/soldes')[L.art] || {})[lot] || {};
  var r = { total: 0, valeur: 0, parEmp: {} };
  Object.keys(s).forEach(function (e) { var q = Number(s[e].q) || 0; r.total += q; r.valeur += Number(s[e].v) || 0; if (q) r.parEmp[e] = q; });
  return r;
}

/* =====================================================================

   ===================================================================== */
var LineEd = {
  defs: {},
  html: function (id, cols, lines, opts) {

    return '<div class="lines" data-lines="' + id + '"><div class="tscroll"><table class="grid lined"><thead><tr>' +
      cols.map(function (c) { return '<th' + (c.type === 'qty' || c.type === 'money' || c.type === 'number' || c.type === 'calc' ? ' class="num"' : '') + (c.w ? ' style="width:' + c.w + '"' : '') + '>' + esc(c.t) + '</th>'; }).join('') +
      '<th class="act"><span class="sr">Retirer</span></th></tr></thead><tbody>' +
      lines.map(function (l) { return LineEd.row(id, l); }).join('') + '</tbody>' +
      (opts.foot ? '<tfoot><tr><td colspan="' + (cols.length + 1) + '" class="lfoot" data-lfoot="' + id + '"></td></tr></tfoot>' : '') +
      '</table></div>' + (opts.fixed ? '' : '<button type="button" class="btn ghost sm" data-ladd="' + id + '">' + icon('plus') + ' ' + esc(opts.addLabel || 'Ajouter une ligne') + '</button>') + '</div>';
  },
  row: function (id, l) {
    var d = LineEd.defs[id];
    return '<tr data-line>' + d.cols.map(function (c) {
      var v = l[c.k];
      if (v === undefined && c.dflt !== undefined) v = typeof c.dflt === 'function' ? c.dflt(l) : c.dflt;
      var lab = ' aria-label="' + attr(c.t) + '" data-lk="' + c.k + '"';
      var cell;
      if (c.type === 'select') {
        var opts = typeof c.opts === 'function' ? c.opts(l) : c.opts;
        cell = '<select' + lab + '>' + '<option value="">—</option>' + opts.map(function (o) { return '<option value="' + attr(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
      } else if (c.type === 'calc') {
        cell = '<span class="calc"' + lab + '>' + (c.calc ? c.calc(l) : '') + '</span>';
      } else if (c.type === 'ro') {
        cell = '<span' + lab + ' data-v="' + attr(v === undefined ? '' : v) + '">' + (c.fmt ? c.fmt(v, l) : esc(v)) + '</span>';
      } else if (c.type === 'qty') {
        cell = '<input inputmode="decimal"' + lab + ' value="' + attr(v === undefined || v === null || v === '' ? '' : qInput(v)) + '">';
      } else if (c.type === 'money' || c.type === 'number') {
        cell = '<input inputmode="decimal"' + lab + ' value="' + attr(v === undefined || v === null ? '' : String(v).replace('.', ',')) + '">';
      } else {
        cell = '<input' + lab + ' value="' + attr(v === undefined || v === null ? '' : v) + '">';
      }
      if (c.hidden) cell = '<input type="hidden" data-lk="' + c.k + '" value="' + attr(v === undefined || v === null ? '' : v) + '">';
      return '<td' + (c.type === 'qty' || c.type === 'money' || c.type === 'number' || c.type === 'calc' ? ' class="num"' : '') + ' data-label="' + attr(c.t) + '">' + cell + '</td>';
    }).join('') + '<td class="act">' + (d.opts.fixed ? '' : '<button type="button" class="ibtn" data-ldel aria-label="Retirer la ligne">' + icon('x') + '</button>') + '</td></tr>';
  },
  readRow: function (id, tr) {
    var d = LineEd.defs[id], l = {}, bad = null;

      var v = raw;

      else if (c.type === 'number') v = raw === '' ? null : parseNum(raw);
      if ((c.type === 'qty' || c.type === 'money' || c.type === 'number') && raw !== '' && isNaN(v)) bad = bad || (c.t + ' : valeur invalide.');
      if ((c.type === 'qty' || c.type === 'money') && v !== null && v < 0) bad = bad || (c.t + ' : valeur négative.');
      l[c.k] = v === '' ? null : v;

    return { l: l, bad: bad };
  },
  read: function (root, id) {
    var d = LineEd.defs[id], out = [], err = null;
    $$('[data-lines="' + id + '"] tbody tr[data-line]', root).forEach(function (tr, i) {
      var r = LineEd.readRow(id, tr);
      var empty = d.cols.every(function (c) { return c.type === 'calc' || c.type === 'ro' || c.hidden || r.l[c.k] === null || r.l[c.k] === undefined || r.l[c.k] === ''; });
      if (empty) return;

};

function docModal(o) {

        runOp(btn, function () { return o.save(head, lines, ctx); }, o.okMsg).then(function (r) { if (r !== false) { m.done = true; m.close(true); resolve(r); } });
      },
      onClose: function () { if (!m.done) resolve(null); }
