/* =====================================================================
   Validations : opérations sensibles soumises à un second responsable.
   ===================================================================== */
var Valid = {
  exec: {},          /* type → function(payload, tx, req) */
  labels: {},
  register: function (type, label, fn) { Valid.exec[type] = fn; Valid.labels[type] = label; },
  unique: function () { return !!(S.params.regles && S.params.regles.validateurUnique); },

  /* Demande une validation, ou exécute aussitôt si l'utilisateur peut
     valider lui-même (mode validateur unique). */
  request: function (o) {
    /* o = { type, module, label, payload, motif, direct: bool } */
    var self = can(o.module, 'valider') && Valid.unique();
    var id = FB.newId();
    var req = { type: o.type, module: o.module, label: o.label, payload: o.payload, motif: o.motif || null, statut: 'attente', date: today(), ts: FB.TS(), par: S.user.uid, parNom: S.member.nom };
    if (self) {
      var tx = new Tx(o.label);
      return Promise.resolve(Valid.exec[o.type](o.payload, tx, req)).then(function () {
        req.statut = 'approuvee'; req.decidePar = S.user.uid; req.decideNom = S.member.nom + ' (validateur unique)'; req.decideTs = FB.TS();
        tx.doc('admin/validations', id, req);
        tx.audit('Validation (validateur unique) : ' + o.label, o.module, id, { motif: o.motif });
        return tx.commit();
      }).then(function () { return { id: id, done: true }; });
    }
    return FB.withTimeout(FB.tref('d/admin/validations/' + id).set(req), 20000, 'demande de validation').then(function () { return { id: id, done: false }; });
  },

  approve: function (id, btn) {
    var r = get('admin/validations', id); if (!r) return;
    if (r.par === S.user.uid && !Valid.unique()) { UI.toast('Vous ne pouvez pas valider votre propre demande.', 'err'); return; }
    if (!can(r.module, 'valider')) { UI.toast("Votre rôle ne permet pas de valider ce type d'opération.", 'err'); return; }
    var fn = Valid.exec[r.type]; if (!fn) { UI.toast('Type de demande inconnu.', 'err'); return; }
    return Data.need(Valid.needs[r.type] || []).then(function () {
      return runOp(btn, function () {
        var tx = new Tx('validation');
        return Promise.resolve(fn(r.payload, tx, r)).then(function () {
          tx.field('admin/validations', id, 'statut', 'approuvee');
          tx.field('admin/validations', id, 'decidePar', S.user.uid);
          tx.field('admin/validations', id, 'decideNom', S.member.nom);
          tx.field('admin/validations', id, 'decideTs', FB.TS());
          tx.audit('Validation approuvée : ' + r.label, r.module, id, { motif: r.motif });
          return tx.commit();
        });
      }, 'Opération validée et exécutée.');
    });
  },
  reject: function (id) {
    var r = get('admin/validations', id); if (!r) return;
    UI.confirm({ title: 'Rejeter la demande', message: r.label, motif: true, danger: true, ok: 'Rejeter' }).then(function (c) {
      if (!c.ok) return;
      var tx = new Tx('rejet');
      tx.field('admin/validations', id, 'statut', 'rejetee');
      tx.field('admin/validations', id, 'decidePar', S.user.uid);
      tx.field('admin/validations', id, 'decideNom', S.member.nom);
      tx.field('admin/validations', id, 'decideTs', FB.TS());
      tx.field('admin/validations', id, 'motifRejet', c.motif);
      if (Valid.onReject[r.type]) Valid.onReject[r.type](r.payload, tx, r);
      tx.audit('Validation rejetée : ' + r.label, r.module, id, { motif: c.motif });
      runOp(null, function () { return tx.commit(); }, 'Demande rejetée.');
    });
  },
  cancel: function (id) {
    var r = get('admin/validations', id); if (!r) return;
    UI.confirm({ title: 'Retirer ma demande', message: r.label }).then(function (c) {
      if (!c.ok) return;
      var tx = new Tx('retrait');
      tx.field('admin/validations', id, 'statut', 'annulee');
      if (Valid.onReject[r.type]) Valid.onReject[r.type](r.payload, tx, r);
      runOp(null, function () { return tx.commit(); }, 'Demande retirée.');
    });
  },
  needs: {},
  onReject: {}
};

/* ---------- période d'affichage (collections volumineuses) ---------- */
var Period = {
  st: {},
  get: function (k, dflt) {
    if (!Period.st[k]) Period.st[k] = LS.json('nerp_per_' + k, null) || dflt || { start: addDays(today(), -90), end: '' };
    return Period.st[k];
  },
  set: function (k, v) { Period.st[k] = v; LS.setJson('nerp_per_' + k, v); },
  html: function (k) {
    var p = Period.get(k);
    return '<div class="period" data-period="' + k + '"><label>Du <input type="date" data-pstart value="' + attr(p.start) + '"></label><label>au <input type="date" data-pend value="' + attr(p.end || '') + '"></label>' +
      '<select data-ppreset aria-label="Période"><option value="">Période…</option><option value="mois">Ce mois</option><option value="mprec">Mois précédent</option><option value="3m">3 derniers mois</option><option value="annee">Cette année</option><option value="tout">Tout</option></select></div>';
  },
  presets: function (v) {
    var t = today(), y = yearOf(t);
    if (v === 'mois') return { start: startOfMonth(t), end: '' };
    if (v === 'mprec') { var d = new Date(t + 'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth() - 1); var s = isoDate(d); var e = addDays(startOfMonth(t), -1); return { start: s, end: e }; }
    if (v === '3m') return { start: addDays(t, -90), end: '' };
    if (v === 'annee') return { start: y + '-01-01', end: '' };
    if (v === 'tout') return { start: '2000-01-01', end: '' };
    return null;
  },
  in: function (k, d) { var p = Period.get(k); return (!p.start || d >= p.start) && (!p.end || d <= p.end); }
};
document.addEventListener('change', function (e) {
  var w = e.target.closest && e.target.closest('[data-period]'); if (!w) return;
  var k = w.dataset.period, p = Object.assign({}, Period.get(k));
  if (e.target.hasAttribute('data-ppreset')) { var x = Period.presets(e.target.value); if (!x) return; p = x; }
  else if (e.target.hasAttribute('data-pstart')) p.start = e.target.value || '2000-01-01';
  else if (e.target.hasAttribute('data-pend')) p.end = e.target.value || '';
  Period.set(k, p);
  if (document.body.dataset.screen === 'scr-app') App.show(App.route + (App.arg ? '/' + App.arg : ''));
});

/* ===== 08-portail.js ===== */
/* =====================================================================
   Portail de l'atelier (même disposition que le portail de l'App AGV) :
   une barre sombre (atelier, personne connectée, déconnexion), puis une
   grille de tuiles — Administration, Direction, et une tuile par bloc
   avec son nom et ses gérants. En dessous, la vue d'ensemble des blocs.
   Le portail ne fait que lire : rien n'y est modifié.
   ===================================================================== */

var Portail = {
  canAdmin: function () { return isOwnerRole() || can('utilisateurs') || can('parametres'); },
  canDirection: function () { return isOwnerRole() || !!(S.role && S.role.f && S.role.conf); },
  canUse: function () {
    if (!S.member) return false;
    return isOwnerRole() || memberBlocs(S.member).length > 1 || Portail.canAdmin() || Portail.canDirection();
  },

  gerants: function (b) {
    return vals(S.members).filter(function (m) { return m.actif && m.role !== 'proprietaire' && memberBlocs(m).indexOf(b) >= 0; });
  },

  bar: function () {
    var info = S.info || {};
    return '<header class="portail-bar">' +
      '<div class="pb-g">' + (info.logo ? '<img src="' + attr(info.logo) + '" alt="">' : Brand.mark(34)) +
        '<div class="pb-t"><strong>' + esc(info.raisonSociale || S.tenant.nom) + '</strong><span>' + esc(APP.nom) + ' — portail de l\'atelier</span></div></div>' +
      '<div class="pb-g"><span class="pb-qui">' + icon('users') + esc(S.member.nom) + '</span>' +
        '<button type="button" class="pb-out" id="pt-out">' + icon('logout') + ' Déconnexion</button></div>' +
      '</header>';
  },

  tile: function (o) {
    return '<button type="button" class="tuile' + (o.cls ? ' ' + o.cls : '') + '" data-pt="' + attr(o.act) + '"' + (o.id ? ' data-id="' + attr(o.id) + '"' : '') + '>' +
      (o.tag ? '<span class="tuile-tag">' + esc(o.tag) + '</span>' : '') +
      (o.img ? '<img class="tuile-logo" src="' + attr(o.img) + '" alt="">' : '<span class="tuile-rond">' + icon(o.icon) + '</span>') +
      '<span class="tuile-t">' + esc(o.t) + '</span>' +
      (o.s ? '<span class="tuile-s">' + esc(o.s) + '</span>' : '') +
      (o.g ? '<span class="tuile-g">' + esc(o.g) + '</span>' : '') +
      '</button>';
  },

  tiles: function () {
    var info = S.info || {}, t = [];
    var lieu = [info.ville || S.tenant.ville, info.adresse].filter(Boolean).join(' — ');
    var blocs = memberBlocs(S.member);
    if (Portail.canAdmin()) t.push(Portail.tile({ act: 'admin', icon: 'gear', t: 'Administration', s: 'Blocs, gérants, rôles et paramètres', g: lieu }));
    if (Portail.canDirection()) t.push(Portail.tile({ act: 'direction', icon: 'direction', img: info.logo || '', t: 'Direction', s: 'Dettes, créances, caisses et stock de ' + plural(blocs.length, 'bloc') }));
    blocs.forEach(function (b) {
      var x = S.blocs[b] || {}, gs = Portail.gerants(b);
      t.push(Portail.tile({
        act: 'bloc', id: b, icon: 'loom', tag: 'BLOC ' + b, t: blocName(b), s: x.ville || (b === 'A' ? lieu : '') || 'Atelier de tissage',
        g: gs.length ? gs.slice(0, 2).map(function (m) { return m.nom; }).join(', ') + (gs.length > 2 ? ' +' + (gs.length - 2) : '') : 'Aucun gérant affecté'
      }));
    });
    if (isOwnerRole() && blocIdsAll().length < maxBlocs()) t.push(Portail.tile({ act: 'nouveau', icon: 'plus', cls: 'neuve', t: 'Nouveau bloc', s: 'Un atelier complet, vide au départ', g: blocIdsAll().length + ' sur ' + maxBlocs() + ' compris' }));
    return '<section class="portail"><div class="portail-in">' + t.join('') + '</div></section>';
  },

  render: function () {
    S.mode = 'portail';
    var el = $('#scr-portail');
    el.innerHTML = '<div class="portail-page">' + Portail.bar() + Portail.tiles() +
      '<section class="portail-corps" id="pt-corps">' +
        (Portail.canDirection() ? '<div class="loading"><span class="spin"></span> Lecture des blocs…</div>' : '<p class="muted center">Choisissez un bloc pour commencer.</p>') +
      '</section></div>';
    Screens.show('scr-portail');
    document.title = 'Portail — ' + APP.nom;
    Portail.bind(el);
    Install.offerAfterLogin();
    if (Portail.canDirection()) Portail.overview();
  },

  bind: function (el) {
    $('#pt-out').addEventListener('click', function () { App.logout(); });
    $$('[data-pt]', el).forEach(function (b) {
      b.addEventListener('click', function () {
        var a = b.dataset.pt;
        if (a === 'admin') App.openAdmin();
        else if (a === 'direction') Portail.direction();
        else if (a === 'bloc') App.openBloc(b.dataset.id);
        else if (a === 'nouveau') Blocs.create().then(function (id) { if (id) Portail.render(); });
      });
    });
  },

  /* ---------- chiffres d'un bloc, lus directement (sans l'ouvrir) ---------- */
  base: function (b) { return 't/' + S.tid + (b === 'A' ? '/d/' : '/blocs/' + b + '/d/'); },
  read: function (b, path) {
    return FB.withTimeout(FB.ref(Portail.base(b) + path).once('value'), 20000, 'lecture').then(function (s) { return s.val() || {}; }, function () { return null; });
  },
  figures: function (b) {
    var paths = ['achats/facturesF', 'ventes/factures', 'finances/comptes', 'finances/soldes', 'stock/soldes', 'finances/depenses'];
    return Promise.all(paths.map(function (p) { return Portail.read(b, p); })).then(function (r) {
      var ff = r[0], fv = r[1], comptes = r[2], soldes = r[3], stock = r[4], dep = r[5];
      var m0 = startOfMonth(today()), t = today();
      var o = { bloc: b };
      o.dettes = ff === null ? null : sum(vals(ff).filter(function (f) { return f.statut !== 'annulee'; }), ffReste);
      var fvv = fv === null ? null : vals(fv).filter(function (f) { return f.statut === 'validee'; });
      o.creances = fvv === null ? null : sum(fvv, function (f) { return Math.max(0, facReste(f)); });
      o.ca = fvv === null ? null : sum(fvv.filter(function (f) { return f.date >= m0 && f.date <= t; }), facDu);
      var parType = function (type) {
        if (comptes === null || soldes === null) return null;
        return sum(Object.keys(comptes).filter(function (k) { return (comptes[k] || {}).type === type; }), function (k) { return Number(soldes[k]) || 0; });
      };
      o.caisse = parType('caisse'); o.mobile = parType('mobile'); o.banque = parType('banque');
      o.stock = stock === null ? null : (function () {
        var v = 0;
        Object.keys(stock).forEach(function (a) { Object.keys(stock[a] || {}).forEach(function (l) { Object.keys(stock[a][l] || {}).forEach(function (e) { v += Number((stock[a][l][e] || {}).v) || 0; }); }); });
        return v;
      })();
      o.depenses = dep === null ? null : sum(vals(dep).filter(function (d) { return d.statut !== 'annulee' && d.date >= m0; }), function (d) { return d.montant || 0; });
      return o;
    });
  },
  allFigures: function () { return Promise.all(memberBlocs(S.member).map(Portail.figures)); },
  v: function (n) { return n === null || n === undefined ? '—' : fmtGNF(n); },
  tot: function (rows, k) { var ok = rows.filter(function (r) { return r[k] !== null; }); return ok.length ? sum(ok, function (r) { return r[k]; }) : null; },

  overview: function () {
    Portail.allFigures().then(function (rows) {
      var z = $('#pt-corps'); if (!z) return;
      var cols = [['ca', "Chiffre d'affaires du mois"], ['depenses', 'Dépenses du mois'], ['creances', 'Créances clients'], ['dettes', 'Dettes fournisseurs'], ['tresor', 'Trésorerie'], ['stock', 'Valeur du stock']];
      rows.forEach(function (r) { r.tresor = r.caisse === null ? null : (r.caisse || 0) + (r.mobile || 0) + (r.banque || 0); });
      z.innerHTML = '<div class="pc-in"><div class="row between wrap"><h2>Vue d\'ensemble des blocs</h2><span class="muted small">' + fmtMois(monthOf(today())) + ' — montants en GNF</span></div>' +
        '<div class="tscroll"><table class="grid pc-table"><thead><tr><th>Bloc</th>' + cols.map(function (c) { return '<th class="num">' + esc(c[1]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function (r) { return '<tr><td><strong>BLOC ' + esc(r.bloc) + '</strong><br><small class="muted">' + esc(blocName(r.bloc)) + '</small></td>' + cols.map(function (c) { return '<td class="num">' + (r[c[0]] === null ? '—' : fmtMoney(r[c[0]])) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody>' + (rows.length > 1 ? '<tfoot><tr><th>Total</th>' + cols.map(function (c) { var x = Portail.tot(rows, c[0]); return '<th class="num">' + (x === null ? '—' : fmtMoney(x)) + '</th>'; }).join('') + '</tr></tfoot>' : '') + '</table></div>' +
        (rows.some(function (r) { return cols.some(function (c) { return r[c[0]] === null; }); }) ? '<p class="small muted">« — » : ces chiffres ne sont pas accessibles avec vos rôles.</p>' : '') +
        (Portail.canDirection() ? '<p class="small muted">La tuile Direction détaille les dettes, créances, caisses et stocks de chaque bloc.</p>' : '') + '</div>';
    });
  },

  /* ---------- Direction : un bandeau par poste, total de tous les blocs à droite ---------- */
  direction: function () {
    var z = $('#pt-corps'); if (!z) return;
    z.innerHTML = '<div class="loading"><span class="spin"></span> Calcul des totaux de tous les blocs…</div>';

          '<div class="band-r"><small>' + esc(totLabel) + '</small><b>' + Portail.v(tot) + '</b></div></div>';
      };
      var stockTot = Portail.tot(rows, 'stock');
      z.innerHTML = '<div class="pc-in"><div class="row between wrap"><h2>Direction</h2><button type="button" class="btn ghost sm" id="pt-retour">' + icon('back') + ' Retour à la vue d\'ensemble</button></div>' +
        '<p class="muted">Situation à ce jour de ' + plural(rows.length, 'bloc') + '. Chaque bandeau donne le chiffre de chaque bloc et, à droite, le total.</p>' +
        band('dettes', 'Dettes fournisseurs', 'dettes', 'Total des dettes') +
        band('creances', 'Créances clients', 'creances', 'Total des créances') +
        band('caisse', 'Caisse (espèces)', 'caisse', 'Total en caisse') +

/* =====================================================================

   droits de l'utilisateur. Aucun chiffre fictif.

/* Graphique en barres groupées (SVG), lisible en clair et en sombre. */
function barChart(o) {
  /* o = { cats:[label], series:[{n, v:[num], cls}], fmt } */
  var W = 680, H = 230, L = 64, B = 34, T = 14, R = 10;
  var max = 0; o.series.forEach(function (s) { s.v.forEach(function (x) { if (x > max) max = x; }); });
  if (!max) return '<p class="muted">Pas encore de données sur la période.</p>';
  var step = Math.pow(10, Math.floor(Math.log10(max))); var top = Math.ceil(max / step) * step; if (top / step < 4) step = step / 2;
  var ticks = []; for (var t = 0; t <= top + 1e-9; t += step) ticks.push(t);
  var y = function (v) { return T + (H - T - B) * (1 - v / top); };
  var cw = (W - L - R) / o.cats.length, bw = Math.min(26, (cw - 8) / o.series.length);
  var g = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + attr(o.title || 'Graphique') + '">';
  ticks.forEach(function (t) { g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + esc(o.fmt ? o.fmt(t) : fmtN(t)) + '</text>'; });
  o.cats.forEach(function (c, i) {
    var x0 = L + i * cw + (cw - bw * o.series.length) / 2;
    o.series.forEach(function (s, k) { var v = s.v[i] || 0; g += '<rect class="' + (s.cls || 's' + k) + '" x="' + (x0 + k * bw) + '" y="' + y(v) + '" width="' + (bw - 2) + '" height="' + Math.max(0, H - B - y(v)) + '" rx="2"><title>' + esc(s.n + ' — ' + c + ' : ' + (o.fmt ? o.fmt(v) : fmtN(v))) + '</title></rect>'; });
    g += '<text class="ax" x="' + (L + i * cw + cw / 2) + '" y="' + (H - B + 16) + '" text-anchor="middle">' + esc(c) + '</text>';
  });
  g += '</svg>';
  return g + '<div class="legend">' + o.series.map(function (s, k) { return '<span><i class="' + (s.cls || 's' + k) + '"></i>' + esc(s.n) + '</span>'; }).join('') + '</div>';
}
function shortMoney(n) { if (Math.abs(n) >= 1e9) return fmtN(n / 1e9, 1) + ' Md'; if (Math.abs(n) >= 1e6) return fmtN(n / 1e6, 1) + ' M'; if (Math.abs(n) >= 1e3) return fmtN(n / 1e3, 0) + ' k'; return fmtN(n); }

/* =====================================================================
   Opérations de stock
   ===================================================================== */
var Stock = {
  editArticle: function (id, preset) {
    var cur = id ? strip(get('stock/articles', id)) : Object.assign({ suiviLot: false, unite: 'kg' }, preset || {});
    var fields = ART_FIELDS.slice();
    if (isOwnerRole()) fields.push({ k: 'negOk', t: 'Autoriser le stock négatif (exception)', type: 'checkbox', span: 2, help: 'À éviter : à réserver à un article dont la sortie doit pouvoir précéder la saisie de l\'entrée. Chaque usage reste tracé.' });
    return UI.formModal({
      title: id ? "Modifier l'article" : 'Nouvel article', fields: fields, values: cur, size: 'l',
      onOpen: function (m) {
        var nat = $('[data-k="nature"]', m.el), lot = $('[data-k="suiviLot"]', m.el), un = $('[data-k="unite"]', m.el), code = $('[data-k="code"]', m.el);
        nat.addEventListener('change', function () {
          if (!id) { lot.checked = ['fil_brut', 'fil_teint', 'tissu'].indexOf(nat.value) >= 0; if (nat.value === 'tissu') un.value = 'm'; }
          if (!id && !code.value) code.value = Stock.suggestCode(nat.value);
        });
      },
      check: function (v) {
        var dup = list('stock/articles', function (a) { return a.code && a.code.toUpperCase() === String(v.code).toUpperCase() && a.id !== id; });
        if (dup.length) return 'Ce code est déjà utilisé par « ' + dup[0].nom + ' ».';
      },
      save: function (v) {
        v.code = String(v.code).toUpperCase();
        var nid = id || FB.newId();
        var rec = Object.assign({}, cur, v);
        if (!id) rec.creeLe = today();
        var tx = new Tx('article');
        tx.doc('stock/articles', nid, rec);
        tx.audit((id ? 'Modification' : 'Création') + " de l'article " + v.code, 'stock', nid, id ? { avant: { nom: cur.nom, seuil: cur.seuil || null, negOk: !!cur.negOk }, apres: { nom: v.nom, seuil: v.seuil || null, negOk: !!v.negOk } } : null);
        return tx.commit().then(function () { return nid; });
      },
      okMsg: 'Article enregistré.'
    });
  },
  suggestCode: function (nature) {
    var pre = ({ fil_brut: 'FB', fil_teint: 'FT', colorant: 'COL', consommable: 'CON', accessoire: 'ACC', emballage: 'EMB', tissu: 'TIS', produit: 'PRD', materiel: 'MAT' })[nature] || 'ART';
    var n = list('stock/articles', function (a) { return String(a.code || '').indexOf(pre + '-') === 0; }).length + 1;
    return pre + '-' + String(n).padStart(3, '0');
  },

  fiche: function (id) {
    var a = articleOf(id); if (!a) return;
    var s = stockArticle(id), mm = canMoney();
    var lots = lotsDispo(id);
    var m = detailModal(a.nom + ' (' + a.code + ')',
      '<div class="two">' + UI.kv([['Nature', esc((NATURES.filter(function (n) { return n.k === a.nature; })[0] || {}).n || '')], ['Unité', esc(a.unite)], ['Disponible', fmtQ(s.dispo, a.unite)], ['Total', fmtQ(s.total, a.unite)], ['Seuil', a.seuil ? fmtQ(a.seuil, a.unite) : '—']]) +
      UI.kv([mm ? ['Valeur', fmtGNF(s.valeur)] : null, mm ? ['Coût moyen', fmtGNF(cump(id)) + ' / ' + esc(a.unite)] : null, ['Fournisseur habituel', esc((get('achats/fournisseurs', a.fournisseur) || {}).nom || '')], ['Suivi par lot', a.suiviLot ? 'Oui' : 'Non'], a.negOk ? ['Stock négatif', UI.badge('Autorisé (exception)', 'warn')] : null]) + '</div>' +
      '<h3>Répartition</h3>' + (lots.length ? '<table class="grid"><thead><tr><th>Lot</th><th>Emplacement</th><th class="num">Quantité</th>' + (mm ? '<th class="num">Valeur</th>' : '') + '</tr></thead><tbody>' +
        lots.map(function (l) { return '<tr><td>' + (l.lot === '_' ? '<span class="muted">sans lot</span>' : '<span class="code">' + esc(lotNum(l.lot)) + '</span>') + '</td><td>' + esc(empName(l.emp)) + '</td><td class="num">' + fmtQ(l.q, a.unite) + '</td>' + (mm ? '<td class="num">' + fmtMoney(l.v) + '</td>' : '') + '</tr>'; }).join('') + '</tbody></table>' : '<p class="muted">Aucun stock.</p>') +
      '<h3>Derniers mouvements</h3><div id="fiche-mvts"><p class="muted"><span class="spin"></span> Chargement…</p></div>',
      [{ t: icon('print') + ' Fiche de stock', act: 'print', cls: 'ghost' }],
      function (act) { if (act === 'print') Stock.printFiche(id); });
    FB.tref('d/stock/mvts').orderByChild('art').equalTo(id).limitToLast(40).once('value').then(function (snap) {
      var mv = vals(snap.val()).sort(function (x, y) { return (y.ts || 0) - (x.ts || 0); });
      var z = $('#fiche-mvts', m.el); if (!z) return;
      z.innerHTML = mv.length ? '<table class="grid"><thead><tr><th>Date</th><th>Type</th><th>Lot</th><th class="num">Quantité</th><th>De → vers</th><th>Document</th></tr></thead><tbody>' + mv.map(function (x) {
        return '<tr><td>' + fmtDate(x.date) + '</td><td>' + esc(MVT_TYPES[x.type] || x.type) + '</td><td class="code">' + esc(lotNum(x.lot)) + '</td><td class="num">' + (x.to && !x.from ? '+' : !x.to ? '−' : '') + fmtQ(x.q) + '</td><td>' + esc(x.from ? empName(x.from) : '—') + ' → ' + esc(x.to ? empName(x.to) : '—') + '</td><td class="code">' + esc(x.doc ? x.doc.n || '' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="muted">Aucun mouvement.</p>';
    }).catch(function () { var z = $('#fiche-mvts', m.el); if (z) z.innerHTML = '<p class="muted">Historique indisponible.</p>'; });
  },
  printFiche: function (id) {
    var a = articleOf(id);
    FB.tref('d/stock/mvts').orderByChild('art').equalTo(id).once('value').then(function (snap) {
      var mv = vals(snap.val()).sort(function (x, y) { return String(x.date + (x.ts || '')).localeCompare(String(y.date + (y.ts || ''))); });
      var solde = 0, mm = canMoney();
      var rows = mv.map(function (x) {
        var signe = x.to && !x.from ? 1 : !x.to && x.from ? -1 : 0; solde += signe * x.q;
        return { d: fmtDate(x.date), t: MVT_TYPES[x.type] || x.type, lot: lotNum(x.lot), e: signe > 0 ? fmtQ(x.q) : '', s: signe < 0 ? fmtQ(x.q) : '', tr: signe === 0 ? empName(x.from) + ' → ' + empName(x.to) : '', solde: fmtQ(solde), doc: x.doc ? x.doc.n : '', v: mm ? fmtMoney(x.val) : '' };
      });
      UI.print({
        title: 'Fiche de stock ' + a.code, docTitle: 'Fiche de stock', docMeta: '<div>' + esc(a.code + ' — ' + a.nom) + '</div><div>Unité : ' + esc(a.unite) + '</div>',
        body: printLines([{ t: 'Date', k: 'd' }, { t: 'Opération', k: 't' }, { t: 'Lot', k: 'lot' }, { t: 'Entrée', k: 'e', n: 1 }, { t: 'Sortie', k: 's', n: 1 }, { t: 'Transfert', k: 'tr' }, { t: 'Solde', k: 'solde', n: 1 }, { t: 'Document', k: 'doc' }].concat(mm ? [{ t: 'Valeur', k: 'v', n: 1 }] : []), rows.map(function (r) { Object.keys(r).forEach(function (k) { r[k] = esc(r[k]); }); return r; }))
      });
    });
  },

  /* Transfert entre emplacements (même entreprise). */
  transfert: function (preset) {
    preset = preset || {};
    var emps = Opt.emplacements();
    UI.formModal({
      title: 'Transférer du stock', size: 'm', values: preset,
      fields: [
        { k: 'art', t: 'Article', type: 'select', req: true, opts: function () { return Opt.articles(); } },
        { k: 'from', t: 'Depuis', type: 'select', req: true, opts: emps },
        { k: 'lot', t: 'Lot', type: 'select', opts: [] },
        { k: 'to', t: 'Vers', type: 'select', req: true, opts: emps },

/* =====================================================================
   Opérations d'achat
   ===================================================================== */
var Achats = {
  editFour: function (id) {
    var cur = id ? strip(get('achats/fournisseurs', id)) : {};
    return UI.formModal({
      title: id ? 'Modifier le fournisseur' : 'Nouveau fournisseur', fields: FOUR_FIELDS, values: cur,
      save: function (v) { var nid = id || FB.newId(); var tx = new Tx('fournisseur'); tx.doc('achats/fournisseurs', nid, Object.assign({}, cur, v)); tx.audit((id ? 'Modification' : 'Création') + ' du fournisseur ' + v.nom, 'achats', nid); return tx.commit().then(function () { return nid; }); },
      okMsg: 'Fournisseur enregistré.'
    });
  },
  ficheFour: function (id) {
    var f = get('achats/fournisseurs', id); if (!f) return;
    var bcs = list('achats/commandes', function (c) { return c.fournisseur === id; }).sort(byKey('date', -1));
    var ffs = list('achats/facturesF', function (x) { return x.fournisseur === id && x.statut !== 'annulee'; });
    detailModal(f.nom, '<div class="two">' + UI.kv([['Contact', esc(f.contact || '')], ['Téléphone', esc(f.tel || '')], ['Email', esc(f.email || '')], ['Ville', esc(f.ville || '')]]) +
      UI.kv([['Délai habituel', f.delai ? plural(f.delai, 'jour') : ''], ['Conditions', esc(f.conditions || '')], ['Total facturé', money(sum(ffs, function (x) { return x.montant; }))], ['Reste à payer', money(sum(ffs, ffReste))]]) + '</div>' +
      '<h3>Commandes</h3>' + (bcs.length ? '<table class="grid"><thead><tr><th>Numéro</th><th>Date</th><th>Statut</th><th class="num">Montant</th></tr></thead><tbody>' + bcs.map(function (c) { return '<tr><td class="code">' + esc(c.num) + '</td><td>' + fmtDate(c.date) + '</td><td>' + statutBadge(c.statut) + (bcEnRetard(c) ? ' ' + UI.badge('En retard', 'err') : '') + '</td><td class="num">' + money(bcTotal(c)) + '</td></tr>'; }).join('') + '</tbody></table>' : '<p class="muted">Aucune commande.</p>'));
  },

  /* ---------- demandes d'achat ---------- */
  daCols: function () {
    return [{ k: 'art', t: 'Article', type: 'select', req: true, opts: function () { return Opt.articles(); }, w: '40%' },
      { k: 'q', t: 'Quantité', type: 'qty', req: true }, { k: 'stock', t: 'En stock', type: 'calc', calc: function (l) { return l.art ? fmtQ(stockArticle(l.art).dispo, artUnit(l.art)) : ''; } },
      { k: 'note', t: 'Précision' }];
  },
  editDA: function (id) {
    var cur = id ? get('achats/demandes', id) : { date: today() };
    return docModal({
      title: id ? 'Demande ' + cur.num : "Nouvelle demande d'achat", values: cur,
      fields: [{ k: 'date', t: 'Date', type: 'date', req: true }, { k: 'besoin', t: 'Besoin pour le', type: 'date' }, { k: 'motif', t: 'Motif', type: 'textarea', rows: 2, span: 2 }],
      lines: { cols: Achats.daCols(), rows: cur.lignes },
      extraActions: [{ t: 'Enregistrer le brouillon', act: 'draft', cls: 'ghost' }], ok: 'Soumettre',
      save: function (h, lines, ctx) {
        var p = id ? Promise.resolve(cur.num) : nextNum('DA', h.date);
        return p.then(function (num) {
          var nid = id || FB.newId();
          var tx = new Tx('demande');
          tx.doc('achats/demandes', nid, Object.assign({}, strip(cur), h, { num: num, lignes: lines, statut: ctx.act === 'draft' ? 'brouillon' : 'soumise', par: cur.par || S.user.uid, parNom: cur.parNom || S.member.nom }));
          if (ctx.act !== 'draft') tx.audit("Demande d'achat soumise " + num, 'achats', nid);
          return tx.commit();
        });
      }, okMsg: 'Demande enregistrée.'
    });
  },
  openDA: function (id) {
    var d = get('achats/demandes', id); if (!d) return;
    if (d.statut === 'brouillon' && d.par === S.user.uid) { Achats.editDA(id); return; }
    var mayDecide = d.statut === 'soumise' && can('achats', 'valider') && (d.par !== S.user.uid || Valid.unique());
    var acts = [];
    if (mayDecide) acts.push({ t: 'Rejeter', act: 'rej', cls: 'ghost' }, { t: 'Approuver', act: 'ok', cls: 'primary' });
    if (d.statut === 'approuvee' && can('achats', 'creer')) acts.push({ t: 'Créer la commande', act: 'bc', cls: 'primary' });
    var m = detailModal("Demande d'achat " + d.num,
      UI.kv([['Statut', statutBadge(d.statut)], ['Date', fmtDate(d.date)], ['Besoin pour le', fmtDate(d.besoin)], ['Demandé par', esc(d.parNom)], ['Motif', esc(d.motif || '')], d.decideNom ? ['Décision', esc(d.decideNom) + (d.motifRejet ? ' — ' + esc(d.motifRejet) : '')] : null]) +
      '<table class="grid"><thead><tr><th>Article</th><th class="num">Quantité</th><th>Précision</th></tr></thead><tbody>' + (d.lignes || []).map(function (l) { return '<tr><td>' + esc(artName(l.art)) + '</td><td class="num">' + fmtQ(l.q, artUnit(l.art)) + '</td><td>' + esc(l.note || '') + '</td></tr>'; }).join('') + '</tbody></table>',
      acts, function (act, btn) {
        if (act === 'ok') { var tx = new Tx('approbation'); tx.field('achats/demandes', id, 'statut', 'approuvee'); tx.field('achats/demandes', id, 'decideNom', S.member.nom); tx.audit("Demande d'achat approuvée " + d.num, 'achats', id); runOp(btn, function () { return tx.commit(); }, 'Demande approuvée.').then(function (ok) { if (ok) m.close(); }); }
        if (act === 'rej') UI.confirm({ title: 'Rejeter la demande', message: d.num, motif: true, danger: true, ok: 'Rejeter' }).then(function (r) { if (!r.ok) return; var tx = new Tx('rejet'); tx.field('achats/demandes', id, 'statut', 'rejetee'); tx.field('achats/demandes', id, 'decideNom', S.member.nom); tx.field('achats/demandes', id, 'motifRejet', r.motif); tx.audit("Demande d'achat rejetée " + d.num, 'achats', id, { motif: r.motif }); runOp(null, function () { return tx.commit(); }, 'Demande rejetée.').then(function () { m.close(); }); });
        if (act === 'bc') { m.close(); Achats.editBC(null, { da: id, lignes: (d.lignes || []).map(function (l) { var a = articleOf(l.art) || {}; return { art: l.art, q: l.q, pu: a.prixRef || null }; }) }); }
      });
  },

  /* ---------- commandes ---------- */
  bcCols: function () {
    return [{ k: 'art', t: 'Article', type: 'select', req: true, opts: function () { return Opt.articles(); }, w: '38%' },
      { k: 'q', t: 'Quantité', type: 'qty', req: true }, { k: 'pu', t: 'Prix unitaire (GNF)', type: 'money', req: true },
      { k: 'tot', t: 'Total', type: 'calc', calc: function (l) { return fmtMoney(Math.round(fromQ(l.q || 0) * (l.pu || 0))); } }];
  },
  editBC: function (id, preset) {
    var cur = id ? get('achats/commandes', id) : Object.assign({ date: today() }, preset || {});
    return docModal({
      title: id ? 'Commande ' + cur.num : 'Nouvelle commande fournisseur', values: cur,
      fields: [{ k: 'fournisseur', t: 'Fournisseur', type: 'select', req: true, opts: Opt.fournisseurs }, { k: 'date', t: 'Date', type: 'date', req: true },
        { k: 'datePrevue', t: 'Livraison prévue le', type: 'date', req: true, dflt: addDays(today(), 7) }, { k: 'notes', t: 'Notes', span: 2 }],
      lines: { cols: Achats.bcCols(), rows: cur.lignes, opts: { foot: function (ls) { return 'Total de la commande : <strong>' + fmtGNF(sum(ls, function (l) { return Math.round(fromQ(l.q || 0) * (l.pu || 0)); })) + '</strong>'; },
        onField: function (k, tr, l) { if (k === 'art' && l.art) { var a = articleOf(l.art); var pu = $('[data-lk="pu"]', tr); if (a && a.prixRef && pu && !pu.value) pu.value = a.prixRef; } } } },
      extraActions: [{ t: 'Enregistrer le brouillon', act: 'draft', cls: 'ghost' }], ok: can('achats', 'valider') ? 'Valider la commande' : 'Enregistrer',
      save: function (h, lines, ctx) {
        var p = id ? Promise.resolve(cur.num) : nextNum('BC', h.date);
        return p.then(function (num) {
          var nid = id || FB.newId();
          var statut = ctx.act === 'draft' || !can('achats', 'valider') ? 'brouillon' : 'envoyee';
          var tx = new Tx('commande');
          tx.doc('achats/commandes', nid, Object.assign({}, strip(cur), h, { num: num, lignes: lines.map(function (l) { return { art: l.art, q: l.q, pu: l.pu, recu: 0 }; }), statut: statut, par: cur.par || S.user.uid, parNom: cur.parNom || S.member.nom }));
          if (cur.da) tx.field('achats/demandes', cur.da, 'statut', 'convertie');
          tx.audit((statut === 'envoyee' ? 'Commande validée ' : 'Commande enregistrée ') + num, 'achats', nid);
          return tx.commit().then(function () { return nid; });
        });
      }, okMsg: 'Commande enregistrée.'
    });
  },
  openBC: function (id) {
    var c = get('achats/commandes', id); if (!c) return;
    if (c.statut === 'brouillon' && can('achats', 'modifier')) {
      var acts0 = [{ t: 'Supprimer', act: 'del', cls: 'ghost' }, { t: 'Modifier', act: 'edit', cls: 'ghost' }];
      if (can('achats', 'valider')) acts0.push({ t: 'Valider la commande', act: 'valider', cls: 'primary' });
      var m0 = detailModal('Commande ' + c.num + ' (brouillon)', Achats.bcHtml(c), acts0, function (act, btn) {
        if (act === 'edit') { m0.close(); Achats.editBC(id); }
        if (act === 'valider') { var tx = new Tx('commande'); tx.field('achats/commandes', id, 'statut', 'envoyee'); tx.audit('Commande validée ' + c.num, 'achats', id); runOp(btn, function () { return tx.commit(); }, 'Commande validée.').then(function (ok) { if (ok) m0.close(); }); }
        if (act === 'del') UI.confirm({ title: 'Supprimer le brouillon', message: c.num, danger: true, ok: 'Supprimer' }).then(function (r) { if (!r.ok) return; var tx = new Tx('commande'); tx.doc('achats/commandes', id, null); tx.audit('Brouillon de commande supprimé ' + c.num, 'achats', id); runOp(null, function () { return tx.commit(); }, 'Brouillon supprimé.').then(function () { m0.close(); }); });
      });
      return;
    }
    var acts = [{ t: icon('print') + ' Bon de commande', act: 'print', cls: 'ghost' }];
    if ((c.statut === 'envoyee' || c.statut === 'partielle') && can('achats', 'creer')) acts.push({ t: 'Réceptionner', act: 'rec', cls: 'primary' });
    if (c.statut === 'envoyee' && can('achats', 'annuler')) acts.unshift({ t: 'Annuler la commande', act: 'cancel', cls: 'ghost' });
    if (c.statut === 'partielle' && can('achats', 'valider')) acts.unshift({ t: 'Solder (ne plus attendre le reste)', act: 'solder', cls: 'ghost' });
    var m = detailModal('Commande ' + c.num, Achats.bcHtml(c), acts, function (act, btn) {
      if (act === 'print') Achats.printBC(c);
      if (act === 'rec') { m.close(); Achats.recevoir(id); }
      if (act === 'cancel' || act === 'solder') UI.confirm({ title: act === 'cancel' ? 'Annuler la commande' : 'Solder la commande', message: c.num, motif: true, danger: act === 'cancel', ok: 'Confirmer' }).then(function (r) {
        if (!r.ok) return; var tx = new Tx('commande'); tx.field('achats/commandes', id, 'statut', act === 'cancel' ? 'annulee' : 'recue'); tx.field('achats/commandes', id, 'motifCloture', r.motif);
        tx.audit((act === 'cancel' ? 'Commande annulée ' : 'Commande soldée ') + c.num, 'achats', id, { motif: r.motif }); runOp(null, function () { return tx.commit(); }, 'Commande mise à jour.').then(function () { m.close(); });
      });
    });
  },
  bcHtml: function (c) {
    var recs = list('achats/receptions', function (r) { return r.bc === c.id; });
    return '<div class="two">' + UI.kv([['Fournisseur', esc(fourName(c.fournisseur))], ['Statut', statutBadge(c.statut) + (bcEnRetard(c) ? ' ' + UI.badge('En retard', 'err') : '')], ['Date', fmtDate(c.date)], ['Livraison prévue', fmtDate(c.datePrevue)]]) +
      UI.kv([['Créée par', esc(c.parNom || '')], ['Montant', money(bcTotal(c))], ['Réceptions', recs.map(function (r) { return '<span class="code">' + esc(r.num) + '</span>'; }).join(', ')], ['Notes', esc(c.notes || '')]]) + '</div>' +
      '<table class="grid"><thead><tr><th>Article</th><th class="num">Commandé</th><th class="num">Reçu</th><th class="num">Reste</th><th class="num">Prix unitaire</th><th class="num">Total</th></tr></thead><tbody>' +
      (c.lignes || []).map(function (l) { return '<tr><td>' + esc(artName(l.art)) + '</td><td class="num">' + fmtQ(l.q) + '</td><td class="num">' + fmtQ(l.recu || 0) + '</td><td class="num">' + fmtQ(Math.max(0, l.q - (l.recu || 0))) + '</td><td class="num">' + moneyN(l.pu) + '</td><td class="num">' + moneyN(Math.round(fromQ(l.q) * l.pu)) + '</td></tr>'; }).join('') + '</tbody></table>';
  },
  printBC: function (c) {
    var f = get('achats/fournisseurs', c.fournisseur) || {};
    UI.print({
      title: 'Bon de commande ' + c.num, docTitle: 'Bon de commande', docMeta: '<div>N° ' + esc(c.num) + '</div><div>Date : ' + fmtDate(c.date) + '</div><div>Livraison prévue : ' + fmtDate(c.datePrevue) + '</div>',
      body: '<div class="box"><strong>Fournisseur</strong><br>' + esc(f.nom || '') + '<br>' + esc([f.adresse, f.ville, f.tel].filter(Boolean).join(' — ')) + '</div>' +
        printLines([{ t: 'Code', f: function (l) { return esc((articleOf(l.art) || {}).code || ''); } }, { t: 'Désignation', f: function (l) { return esc(artName(l.art)); } }, { t: 'Quantité', n: 1, f: function (l) { return fmtQ(l.q, artUnit(l.art)); } }, { t: 'Prix unitaire', n: 1, f: function (l) { return fmtMoney(l.pu); } }, { t: 'Total', n: 1, f: function (l) { return fmtMoney(Math.round(fromQ(l.q) * l.pu)); } }], c.lignes || []) +
        printTotals([['Total', fmtGNF(bcTotal(c)), true]]) + (c.notes ? '<p>' + esc(c.notes) + '</p>' : '') + '<div class="sig"><div>Le responsable des achats</div><div>Le fournisseur</div></div>'
    });
  },

  /* ---------- réception ---------- */
  recevoir: function (bcId) {
    var c = get('achats/commandes', bcId); if (!c) return;
    var rows = (c.lignes || []).map(function (l, i) {
      var a = articleOf(l.art) || {};
      return { idx: i, art: l.art, cmd: l.q, deja: l.recu || 0, recu: Math.max(0, l.q - (l.recu || 0)), refuse: 0, lotF: '', couleur: a.couleur || '', emp: a.empDefaut || 'MAG-MP', defauts: '' };
    }).filter(function (r) { return r.recu > 0; });
    var cols = [
      { k: 'idx', t: '', hidden: true }, { k: 'art', t: 'Article', type: 'ro', fmt: function (v) { return esc(artName(v)); } },
      { k: 'cmd', t: 'Commandé', type: 'ro', fmt: function (v, l) { return fmtQ(v) + (l.deja ? '<br><small class="muted">déjà reçu ' + fmtQ(l.deja) + '</small>' : ''); } },
      { k: 'recu', t: 'Livré', type: 'qty' }, { k: 'refuse', t: 'Refusé', type: 'qty' },
      { k: 'acc', t: 'Accepté', type: 'calc', calc: function (l) { return fmtQ(Math.max(0, (l.recu || 0) - (l.refuse || 0))); } },
      { k: 'lotF', t: 'Lot fournisseur' }, { k: 'couleur', t: 'Couleur', type: 'select', opts: Opt.couleurs },
      { k: 'emp', t: 'Emplacement', type: 'select', opts: function () { return Opt.emplacements(); } },
      { k: 'defauts', t: 'Défauts constatés' }
    ];
    return docModal({
      title: 'Réception — commande ' + c.num + ' — ' + fourName(c.fournisseur), size: 'xl',
      intro: 'Saisissez ce qui a été livré et ce qui est refusé. Seul l\'accepté entre en stock, au prix de la commande.',
      fields: [{ k: 'date', t: 'Date de réception', type: 'date', req: true, dflt: today() }, { k: 'bl', t: 'N° du bon de livraison' }, { k: 'obs', t: 'Observations', span: 2 }],
      lines: { cols: cols, rows: rows, opts: { fixed: true } },
      ok: 'Valider la réception',
      check: function (h, lines) {
        for (var i = 0; i < lines.length; i++) {
          var l = lines[i], line = c.lignes[l.idx];
          if ((l.refuse || 0) > (l.recu || 0)) return artName(l.art) + ' : le refusé dépasse le livré.';
          if ((l.recu || 0) - (l.refuse || 0) > line.q - (line.recu || 0)) return artName(l.art) + ' : l\'accepté dépasse le reste à recevoir (' + fmtQ(line.q - (line.recu || 0)) + ').';
          if (!l.emp && (l.recu || 0) > (l.refuse || 0)) return artName(l.art) + ' : choisissez l\'emplacement.';
        }
        if (!lines.some(function (l) { return (l.recu || 0) > 0; })) return 'Aucune quantité livrée.';
      },
      save: function (h, lines) {
        return nextNum('REC', h.date).then(function (num) {
          var rid = FB.newId(), tx = new Tx('réception');
          var doc = { t: 'REC', id: rid, n: num };
          var lignesRec = [], valeur = 0;
          var newLignes = clone(c.lignes);
          lines.forEach(function (l) {
            var line = c.lignes[l.idx], a = articleOf(l.art) || {};
            var acc = Math.max(0, (l.recu || 0) - (l.refuse || 0));
            var lot = '_';
            if (acc > 0) {
              if (a.suiviLot) {
                lot = FB.newId();
                tx.doc('stock/lots', lot, { num: num + (lines.length > 1 ? '-' + (l.idx + 1) : ''), art: l.art, origine: 'achat', date: h.date, couleur: l.couleur || a.couleur || null, lotFournisseur: l.lotF || null, fournisseur: c.fournisseur || null, statutQ: 'conforme', cu: line.pu, src: 'achats', docNum: num, rec: rid });
              }
              var val = Math.round(fromQ(acc) * line.pu);
              valeur += val;
              tx.mvt({ type: 'reception', art: l.art, lot: lot, q: acc, to: l.emp, val: val, src: 'achats', date: h.date, doc: doc });
            }
            newLignes[l.idx].recu = (line.recu || 0) + acc;
            lignesRec.push({ art: l.art, livre: l.recu || 0, refuse: l.refuse || 0, accepte: acc, pu: line.pu, lot: lot, lotF: l.lotF || null, emp: l.emp, defauts: l.defauts || null });
          });
          var complet = newLignes.every(function (x) { return (x.recu || 0) >= x.q; });
          tx.doc('achats/receptions', rid, { num: num, date: h.date, bc: c.id, bcNum: c.num, fournisseur: c.fournisseur || null, bl: h.bl || null, obs: h.obs || null, lignes: lignesRec, valeur: valeur, par: S.user.uid, parNom: S.member.nom });
          tx.field('achats/commandes', c.id, 'lignes', newLignes);
          tx.field('achats/commandes', c.id, 'statut', complet ? 'recue' : 'partielle');
          tx.audit('Réception ' + num + ' (commande ' + c.num + ')', 'achats', rid);
          return tx.commit().then(function () { return rid; });
        });
      },
      okMsg: 'Réception validée : le stock est à jour.'
    }).then(function (rid) {
      if (rid && can('achats', 'creer')) UI.confirm({ title: 'Facture du fournisseur', message: 'Voulez-vous saisir maintenant la facture de cette livraison ?', ok: 'Saisir la facture' }).then(function (r) { if (r.ok) setTimeout(function () { Achats.factureDepuisRec(rid); }, 300); });
    });
  },
  openRec: function (id) {
    var r = get('achats/receptions', id); if (!r) return;
    var acts = [];
    if (can('stock', 'creer') || can('achats', 'creer')) acts.push({ t: 'Retour au fournisseur', act: 'retour', cls: 'ghost' });
    if (!r.factureNum && can('achats', 'creer')) acts.push({ t: 'Saisir la facture', act: 'ff', cls: 'primary' });
    var m = detailModal('Réception ' + r.num,
      UI.kv([['Commande', '<span class="code">' + esc(r.bcNum) + '</span>'], ['Fournisseur', esc(fourName(r.fournisseur))], ['Date', fmtDate(r.date)], ['Bon de livraison', esc(r.bl || '')], ['Reçu par', esc(r.parNom)], ['Valeur entrée en stock', money(r.valeur)], ['Facture', esc(r.factureNum || 'non saisie')], ['Observations', esc(r.obs || '')]]) +
      '<table class="grid"><thead><tr><th>Article</th><th class="num">Livré</th><th class="num">Refusé</th><th class="num">Accepté</th><th>Lot</th><th>Défauts</th></tr></thead><tbody>' +
      (r.lignes || []).map(function (l) { return '<tr><td>' + esc(artName(l.art)) + '</td><td class="num">' + fmtQ(l.livre) + '</td><td class="num">' + fmtQ(l.refuse) + '</td><td class="num">' + fmtQ(l.accepte) + '</td><td class="code">' + esc(l.lot !== '_' ? lotNum(l.lot) : '') + (l.lotF ? ' <small class="muted">(' + esc(l.lotF) + ')</small>' : '') + '</td><td>' + esc(l.defauts || '') + '</td></tr>'; }).join('') + '</tbody></table>',
      acts, function (act) {
        if (act === 'ff') { m.close(); Achats.factureDepuisRec(id); }
        if (act === 'retour') { m.close(); Achats.retour(id); }
      });
  },
  retour: function (recId) {
    var r = get('achats/receptions', recId);
    var opts = (r.lignes || []).filter(function (l) { return l.accepte > 0; }).map(function (l, i) { return [String(i), artName(l.art) + (l.lot !== '_' ? ' — lot ' + lotNum(l.lot) : '')]; });
    UI.formModal({
      title: 'Retour au fournisseur — ' + r.num, size: 's',
      fields: [{ k: 'ligne', t: 'Article', type: 'select', req: true, opts: opts }, { k: 'q', t: 'Quantité retournée', type: 'qty', req: true }, { k: 'date', t: 'Date', type: 'date', req: true, dflt: today() }, { k: 'motif', t: 'Motif', type: 'textarea', req: true, rows: 2 }],
      save: function (v) {
        var l = r.lignes.filter(function (x) { return x.accepte > 0; })[Number(v.ligne)];
        var tx = new Tx('retour');
        tx.mvt({ type: 'retour_fournisseur', art: l.art, lot: l.lot, q: v.q, from: l.emp, src: 'achats', date: v.date, motif: v.motif, doc: { t: 'REC', id: recId, n: r.num }, val: Math.round(fromQ(v.q) * l.pu) });
        tx.audit('Retour fournisseur sur ' + r.num + ' : ' + fmtQ(v.q) + ' ' + artName(l.art), 'achats', recId, { motif: v.motif });
        return tx.commit();
      }, okMsg: 'Retour enregistré. Pensez à demander un avoir au fournisseur.'
    });
  },

  /* ---------- factures fournisseurs ---------- */
  factureDepuisRec: function (recId) {
    var r = get('achats/receptions', recId); if (!r) return;
    var f = get('achats/fournisseurs', r.fournisseur) || {};
    Achats.editFF(null, { fournisseur: r.fournisseur, montant: r.valeur, recs: [recId], recNum: r.num, bcNum: r.bcNum, echeance: addDays(today(), f.delaiPaiement || 30) });
  },
  editFF: function (id, preset) {
    var cur = id ? get('achats/facturesF', id) : Object.assign({ date: today() }, preset);
    UI.formModal({
      title: id ? 'Facture ' + cur.num : 'Facture fournisseur' + (cur.recNum ? ' — réception ' + cur.recNum : ''), values: cur,
      intro: cur.recNum ? 'Montant proposé : valeur de la réception au prix de la commande. Corrigez-le si la facture diffère.' : '',
      fields: [{ k: 'fournisseur', t: 'Fournisseur', type: 'select', req: true, opts: Opt.fournisseurs }, { k: 'numFournisseur', t: 'N° de facture du fournisseur' },
        { k: 'date', t: 'Date de facture', type: 'date', req: true }, { k: 'echeance', t: 'Échéance', type: 'date', req: true, dflt: addDays(today(), 30) },
        { k: 'montant', t: 'Montant total (GNF)', type: 'money', req: true }, { k: 'objet', t: 'Objet', ph: 'Livraison de fils…' }],
      save: function (v) {
        return nextNum('FF', v.date).then(function (num) {
          var fid = FB.newId(), tx = new Tx('facture fournisseur');
          var recVal = sum(cur.recs || [], function (rid) { return (get('achats/receptions', rid) || {}).valeur || 0; });
          tx.doc('achats/facturesF', fid, Object.assign({}, v, { num: num, paye: 0, recs: cur.recs || null, bcNum: cur.bcNum || null, ecart: cur.recs ? v.montant - recVal : null, statut: 'validee', par: S.user.uid, parNom: S.member.nom }));
          (cur.recs || []).forEach(function (rid) { tx.field('achats/receptions', rid, 'factureNum', num); tx.field('achats/receptions', rid, 'facture', fid); });
          tx.audit('Facture fournisseur ' + num + ' — ' + fmtGNF(v.montant), 'achats', fid);
          return tx.commit();
        });
      }, okMsg: 'Facture enregistrée : la dette fournisseur est à jour.'
    });
  },
  openFF: function (id) {
    var f = get('achats/facturesF', id); if (!f) return;
    var reste = ffReste(f);
    var acts = [];
    if (reste > 0 && f.statut !== 'annulee' && (can('achats', 'creer') || can('finances', 'creer'))) acts.push({ t: 'Enregistrer un paiement', act: 'pay', cls: 'primary' });
    var m = detailModal('Facture fournisseur ' + f.num,
      UI.kv([['Fournisseur', esc(fourName(f.fournisseur))], ['Référence fournisseur', esc(f.numFournisseur || '')], ['Date', fmtDate(f.date)], ['Échéance', fmtDate(f.echeance)], ['Montant', money(f.montant)], ['Payé', money(f.paye || 0)], ['Reste à payer', money(reste)], ['État', statutBadge(ffEtat(f))],
        f.ecart ? ['Écart avec la réception', money(f.ecart) + ' <small class="muted">(prix facturé différent de la commande)</small>'] : null, f.recNum || f.bcNum ? ['Commande', esc(f.bcNum || '')] : null]),
      acts, function (act) { if (act === 'pay') { m.close(); Achats.payerFF(id); } });
  },
  payerFF: function (id) {
    var f = get('achats/facturesF', id); if (!f) return;
    var reste = ffReste(f);
    UI.formModal({
      title: 'Paiement — ' + f.num + ' — ' + fourName(f.fournisseur), size: 's', fields: payFields(reste),
      intro: 'Reste à payer : <strong>' + fmtGNF(reste) + '</strong>',
      save: function (v) {
        return nextNum('PAI', v.date).then(function (num) {
          var tx = new Tx('paiement fournisseur');
          tx.op({ compte: v.compte, sens: 's', montant: v.montant, date: v.date, cat: 'matieres', centre: 'tissage', src: 'achats', doc: { t: 'FF', id: id, n: f.num }, libelle: 'Paiement facture ' + f.num + ' — ' + fourName(f.fournisseur), tiers: fourName(f.fournisseur), recu: num, ref: v.ref || null });
          tx.inc('d/achats/facturesF/' + id + '/paye', v.montant);
          tx.audit('Paiement fournisseur ' + num + ' sur ' + f.num + ' : ' + fmtGNF(v.montant), 'achats', id);
          return tx.commit();
        });
      }, okMsg: 'Paiement enregistré.'
    });
  },

  /* ---------- achat comptant : commande + réception + facture + paiement ---------- */
  comptant: function () {
    var cols = Achats.bcCols().concat([{ k: 'lotF', t: 'Lot fournisseur' }, { k: 'couleur', t: 'Couleur', type: 'select', opts: Opt.couleurs }]);
    docModal({
      title: 'Achat payé comptant', intro: "Pour un achat réglé sur place (marché, boutique) : la commande, la réception, la facture et le paiement sont enregistrés en une fois.",
      fields: [{ k: 'fournisseur', t: 'Fournisseur', type: 'select', opts: Opt.fournisseurs, emptyLabel: 'Fournisseur occasionnel' }, { k: 'tiers', t: 'Nom du vendeur (si occasionnel)' },
        { k: 'date', t: 'Date', type: 'date', req: true, dflt: today() }, { k: 'emp', t: 'Entrée dans', type: 'select', req: true, opts: function () { return Opt.emplacements(); }, dflt: 'MAG-MP' },
        { k: 'compte', t: 'Payé avec', type: 'select', req: true, opts: Opt.comptes, dflt: 'caisse' }, { k: 'ref', t: 'Référence du reçu' }],
      lines: { cols: cols, opts: { foot: function (ls) { return 'Total payé : <strong>' + fmtGNF(sum(ls, function (l) { return Math.round(fromQ(l.q || 0) * (l.pu || 0)); })) + '</strong>'; } } },
      ok: "Enregistrer l'achat",
      save: function (h, lines) {
        var total = sum(lines, function (l) { return Math.round(fromQ(l.q) * l.pu); });
        if (!(total > 0)) throw new Error('Montant total nul.');
        return Promise.all([nextNum('BC', h.date), nextNum('REC', h.date), nextNum('FF', h.date), nextNum('PAI', h.date)]).then(function (n) {
          var bc = FB.newId(), rid = FB.newId(), fid = FB.newId(), tx = new Tx('achat comptant');
          var doc = { t: 'REC', id: rid, n: n[1] };
          var lignesRec = [];
          lines.forEach(function (l, i) {
            var a = articleOf(l.art) || {}, lot = '_';
            if (a.suiviLot) { lot = FB.newId(); tx.doc('stock/lots', lot, { num: n[1] + (lines.length > 1 ? '-' + (i + 1) : ''), art: l.art, origine: 'achat', date: h.date, couleur: l.couleur || a.couleur || null, lotFournisseur: l.lotF || null, fournisseur: h.fournisseur || null, statutQ: 'conforme', cu: l.pu, src: 'achats', docNum: n[1], rec: rid }); }
            tx.mvt({ type: 'reception', art: l.art, lot: lot, q: l.q, to: h.emp, val: Math.round(fromQ(l.q) * l.pu), src: 'achats', date: h.date, doc: doc });
            lignesRec.push({ art: l.art, livre: l.q, refuse: 0, accepte: l.q, pu: l.pu, lot: lot, lotF: l.lotF || null, emp: h.emp });
          });
          var tiers = h.fournisseur ? fourName(h.fournisseur) : (h.tiers || 'Fournisseur occasionnel');
          tx.doc('achats/commandes', bc, { num: n[0], date: h.date, datePrevue: h.date, fournisseur: h.fournisseur || null, tiers: h.tiers || null, lignes: lines.map(function (l) { return { art: l.art, q: l.q, pu: l.pu, recu: l.q }; }), statut: 'recue', comptant: true, par: S.user.uid, parNom: S.member.nom });
          tx.doc('achats/receptions', rid, { num: n[1], date: h.date, bc: bc, bcNum: n[0], fournisseur: h.fournisseur || null, lignes: lignesRec, valeur: total, factureNum: n[2], facture: fid, par: S.user.uid, parNom: S.member.nom });
          tx.doc('achats/facturesF', fid, { num: n[2], fournisseur: h.fournisseur || null, tiers: h.tiers || null, date: h.date, echeance: h.date, montant: total, paye: total, recs: [rid], bcNum: n[0], objet: 'Achat comptant', statut: 'validee', par: S.user.uid, parNom: S.member.nom });
          tx.op({ compte: h.compte, sens: 's', montant: total, date: h.date, cat: 'matieres', centre: 'tissage', src: 'achats', doc: { t: 'FF', id: fid, n: n[2] }, libelle: 'Achat comptant ' + n[0] + ' — ' + tiers, tiers: tiers, recu: n[3], ref: h.ref || null });
          tx.audit('Achat comptant ' + n[0] + ' — ' + fmtGNF(total), 'achats', bc);
          return tx.commit();
        });
      }, okMsg: 'Achat enregistré : stock et caisse à jour.'
    });
  }
};

view('teinture/recettes', {

  /* ---------- besoins et coût prévisionnel ---------- */
  coutMoyenCouleur: function (couleur) {
    var lots = list('stock/lots', function (l) { var a = articleOf(l.art); return a && a.nature === 'fil_teint' && l.couleur === couleur && (l.statutQ === 'conforme' || l.derogation); });

    return q > 0 ? v / fromQ(q) : null;
  },
  dispoCouleur: function (couleur) {

    return '<table class="grid"><thead><tr><th>Fil teint</th><th class="num">Besoin</th><th class="num">Disponible</th>' + (mm ? '<th class="num">Coût moyen / kg</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table>' +

        { k: 'debut', t: 'Début (AAAA-MM-JJ)', ph: today() }, { k: 'fin', t: 'Fin (AAAA-MM-JJ)' }, { k: 'qte', t: 'Réalisé' }, { k: 'incident', t: 'Incident' }], rows: rows, opts: { fixed: true }, req: false },

  /* Réception : pièces acceptées, second choix, rebut ; fil rendu ; coût réel */
  reception: function (id) {
    var o = get('production/ordres', id);
    var md = modeleOf(o.modele) || {};
    var suivis = list('production/suivis', function (s) { return s.op === id; });
    var moSuivi = sum(suivis, function (s) { return s.cout || 0; });
    var sur = (o.sorties || []).map(function (s, i) { return { idx: i, lot: s.lot, sorti: s.q - (s.rendu || 0), rendu: null }; }).filter(function (r) { return r.sorti > 0; });
    var imput = ((col('finances/imputations')[id] || {}).total) || 0;
    var nb = Math.max(1, o.nbPieces || 1);
    var pieces = []; for (var i = 0; i < nb; i++) pieces.push({ q: Math.round(o.longueur / nb), classe: 'accepte' });
    var lidP = 'rp_' + id, lidF = 'rf_' + id, lidC = 'rc_' + id;
    var mm = canMoney();
    var dest = o.nature === 'formation' ? 'FORM-PF' : 'PF';
    var m = UI.modal({
      title: 'Réception de la production — ' + o.num, size: 'xl',
      body: '<p class="muted intro">Mesurez et contrôlez chaque pièce. Les pièces acceptées entrent en ' + esc(empName(dest)) + ', le second choix en ' + esc(empName('SC')) + '. Le rebut ne crée pas de stock : son coût est réparti sur les mètres conservés.</p>' +
        '<form class="mform">' + UI.fields([{ k: 'date', t: 'Date de réception', type: 'date', req: true, dflt: today() }, { k: 'finitions', t: 'Coût des finitions (GNF)', type: 'money' }, { k: 'moExtra', t: "Main-d'œuvre non saisie au suivi (GNF)", type: 'money', help: "Main-d'œuvre déjà saisie au suivi journalier : " + (mm ? fmtGNF(moSuivi) : '•••') }, { k: 'obs', t: 'Observations du contrôle', type: 'textarea', rows: 2, span: 2 }], {}) + '</form>' +
        '<h3>Pièces mesurées</h3>' + LineEd.html(lidP, [{ k: 'q', t: 'Longueur (m)', type: 'qty', req: true }, { k: 'classe', t: 'Classement', type: 'select', req: true, opts: [['accepte', 'Accepté'], ['second', 'Second choix'], ['rebut', 'Rebut']] }, { k: 'defauts', t: 'Défauts' }], pieces, { addLabel: 'Ajouter une pièce' }) +
        (sur.length ? '<h3>Fil restant sur le métier</h3><p class="small muted">Indiquez le fil non utilisé rendu au magasin. Le reste est compté comme consommé.</p>' + LineEd.html(lidF, [{ k: 'idx', hidden: true, t: '' }, { k: 'lot', t: 'Lot', type: 'ro', fmt: function (v) { return '<span class="code">' + esc(lotNum(v)) + '</span>'; } }, { k: 'sorti', t: 'Sur le métier', type: 'ro', fmt: function (v) { return fmtQ(v, 'kg'); } }, { k: 'rendu', t: 'Rendu (kg)', type: 'qty' }], sur, { fixed: true }) : '<p class="tx-err">Aucun fil n\'est sorti pour cet ordre : le coût du fil sera nul.</p>') +
        '<h3>Consommables utilisés</h3>' + LineEd.html(lidC, [{ k: 'art', t: 'Article', type: 'select', req: true, opts: function () { return Opt.articles(function (a) { return ['consommable', 'accessoire', 'emballage'].indexOf(a.nature) >= 0; }); } }, { k: 'emp', t: 'Pris dans', type: 'select', req: true, opts: function () { return Opt.emplacements(); } }, { k: 'q', t: 'Quantité', type: 'qty', req: true }], [], { min: 0 }),
      actions: [{ t: 'Annuler', act: 'cancel', cls: 'ghost' }, { t: 'Valider la réception', act: 'ok', cls: 'primary' }],
      onOpen: function (mm2) { LineEd.bind(mm2.el); },
      onAct: function (act, btn) {
        if (act === 'cancel') { m.close(); return; }
        var h = UI.readFields(m.el, [{ k: 'date', type: 'date', req: true, t: 'Date' }, { k: 'finitions', type: 'money', t: 'Finitions' }, { k: 'moExtra', type: 'money', t: "Main-d'œuvre" }, { k: 'obs', t: 'Obs' }]); if (!h) return;
        var ps = LineEd.read(m.el, lidP); if (!ps) return;
        if (!ps.length) { UI.toast('Ajoutez au moins une pièce (même en rebut).', 'err'); return; }
        var fr = sur.length ? LineEd.read(m.el, lidF) : []; if (!fr) return;
        var cs = LineEd.read(m.el, lidC); if (!cs) return;
        if (fr.some(function (x) { return (x.rendu || 0) > x.sorti; })) { UI.toast('Le fil rendu dépasse le fil sur le métier.', 'err'); return; }
        var garde = ps.filter(function (p) { return p.classe !== 'rebut'; });
        runOp(btn, function () {
          return Promise.all(garde.map(function () { return nextNum('PCE', h.date); })).then(function (nums) {
            var tx = new Tx('réception de production'), doc = { t: 'OP', id: id, n: o.num };
            var sorties = clone(o.sorties || []), cFil = 0, filQ = 0, lotsFil = [];
            /* fil rendu puis fil consommé */
            fr.forEach(function (x) { var s = sorties[x.idx], L = get('stock/lots', s.lot); if (x.rendu > 0) { var r = tx.mvt({ type: 'retour_prod', art: L.art, lot: s.lot, q: x.rendu, from: 'ENC-PROD', to: o.nature === 'formation' ? 'FORM' : 'MAG-FT', src: 'production', date: h.date, doc: doc }); s.rendu = (s.rendu || 0) + x.rendu; } });
            sorties.forEach(function (s) { var reste = s.q - (s.rendu || 0); if (reste > 0) { var L = get('stock/lots', s.lot); var r = tx.mvt({ type: 'conso_prod', art: L.art, lot: s.lot, q: reste, from: 'ENC-PROD', src: 'production', date: h.date, doc: doc }); cFil += r.val; filQ += reste; s.consomme = reste; if (lotsFil.indexOf(s.lot) < 0) lotsFil.push(s.lot); } });
            var cConso = 0; cs.forEach(function (x) { var r = tx.mvt({ type: 'conso_prod', art: x.art, lot: '_', q: x.q, from: x.emp, src: 'production', date: h.date, doc: doc }); cConso += r.val; });
            var mo = moSuivi + (h.moExtra || 0), fin = h.finitions || 0;
            var total = Math.round(cFil + cConso + mo + fin + imput);
            var mGarde = sum(garde, function (p) { return p.q; }), mRebut = sum(ps.filter(function (p) { return p.classe === 'rebut'; }), function (p) { return p.q; });
            var cuM = mGarde > 0 ? Math.round(total / fromQ(mGarde)) : 0;
            var allocated = 0;
            var piecesOut = ps.map(function (p) {
              if (p.classe === 'rebut') return { q: p.q, classe: 'rebut', defauts: p.defauts || null };
              var num = nums.shift(), lid = FB.newId();
              var isLast = garde[garde.length - 1] === p;
              var val = isLast ? total - allocated : Math.round(fromQ(p.q) * cuM); allocated += val;
              tx.doc('stock/lots', lid, { num: num, art: md.article, origine: o.nature === 'formation' ? 'formation' : 'production', date: h.date, statutQ: 'conforme', classement: p.classe === 'second' ? 'Second choix' : 'Accepté', longueur: p.q, cu: cuM, src: 'production', docNum: o.num, op: id, modele: o.modele, lotsFil: lotsFil, defauts: p.defauts || null });
              tx.mvt({ type: 'entree_prod', art: md.article, lot: lid, q: p.q, to: p.classe === 'second' ? 'SC' : dest, val: val, src: 'production', date: h.date, doc: doc });
              return { q: p.q, classe: p.classe, defauts: p.defauts || null, num: num, lot: lid };
            });
            var upd = { statut: 'termine', finReelle: h.date, sorties: sorties, coutReel: total, coutMetre: cuM, metresProduits: mGarde,
              reception: { date: h.date, pieces: piecesOut, filQ: filQ, obs: h.obs || null, cout: { fil: cFil, conso: cConso, mo: mo, finitions: fin, depenses: imput }, coutRebut: mGarde > 0 ? Math.round(total * mRebut / (mGarde + mRebut)) : total, metresRebut: mRebut, par: S.member.nom } };
            Object.keys(upd).forEach(function (k) { tx.field('production/ordres', id, k, upd[k]); });
            tx.field('production/metiers', o.metier, 'etat', 'disponible');
            tx.audit('Réception de production ' + o.num + ' : ' + fmtQ(mGarde, 'm') + ' conservés, ' + fmtQ(mRebut, 'm') + ' en rebut', 'production', id);
            return tx.commit();
          });
        }, 'Production réceptionnée : les pièces sont en stock.').then(function (ok) { if (ok) m.close(); });
      }
    });
  }
};

var Qualite = {
  controlerLot: function (lotId) {
    var L = get('stock/lots', lotId); if (!L) return;
    var a = articleOf(L.art) || {};
    var objet = a.nature === 'tissu' ? 'tissu' : 'teinture';
    var types = plist('typesControle', TYPES_CONTROLE_DEFAUT).filter(function (t) { return t.objet === objet; });
    var tei = L.tei ? get('teinture/lots', L.tei) : null;
    var lid = 'qc_' + lotId;
    var rows = types.map(function (t) { return { type: t.id, methode: t.methode || '', resultat: '', ok: '' }; });
    var fields = [{ k: 'date', t: 'Date du contrôle', type: 'date', req: true, dflt: today() }, { k: 'photo', t: 'Photo (facultative)', type: 'image' }, { k: 'obs', t: 'Observations', type: 'textarea', rows: 2, span: 2 },
      { k: 'decision', t: 'Décision', type: 'select', req: true, opts: [['conforme', 'Conforme : libérer le lot'], ['reprise', 'Non conforme : reprendre en teinture'], ['rebut', 'Non conforme : mettre au rebut'], ['garder', 'Non conforme : garder en quarantaine (décision plus tard)']].filter(function (o) { return objet === 'teinture' || o[0] !== 'reprise'; }) },
      { k: 'cause', t: 'Cause probable (si non conforme)', type: 'textarea', rows: 2, span: 2 }, { k: 'action', t: 'Action corrective proposée', type: 'textarea', rows: 2, span: 2 }];
    docModal({
      title: 'Contrôle du lot ' + L.num + ' — ' + artName(L.art), size: 'xl',
      intro: (tei ? 'Lot de teinture ' + esc(tei.num) + ' — recette ' + esc(tei.recetteNom) + ', rendement ' + fmtPct(tei.rendement || 0) + '. ' : '') + 'Saisissez les tests effectués. Le lot ne peut être jugé conforme que si au moins un test a été fait et que tous sont conformes.',
      fields: fields,
      linesTitle: 'Tests effectués',
      lines: { cols: [{ k: 'type', t: 'Test', type: 'select', req: true, opts: function () { return plist('typesControle', TYPES_CONTROLE_DEFAUT).map(function (t) { return [t.id, t.nom]; }); } },
        { k: 'methode', t: 'Méthode' }, { k: 'resultat', t: 'Résultat observé', req: true }, { k: 'ok', t: 'Conforme ?', type: 'select', req: true, opts: [['1', 'Oui'], ['0', 'Non']] }], rows: rows },
      ok: 'Enregistrer la décision',
      check: function (h, lines) {
        var allOk = lines.length && lines.every(function (l) { return l.ok === '1'; });
        if (h.decision === 'conforme' && !allOk) return 'Un lot ne peut être déclaré conforme que si tous les tests saisis sont conformes.';
        if (h.decision !== 'conforme' && allOk) return 'Tous les tests sont conformes : choisissez « Conforme ».';
      },
      save: function (h, lines) {
        return Promise.all([nextNum('CQ', h.date), h.decision !== 'conforme' ? nextNum('NC', h.date) : null]).then(function (nn) {
          var num = nn[0], numNC = nn[1];
          var tx = new Tx('contrôle qualité'), doc = { t: 'CQ', id: lotId, n: num };
          var photoId = null;
          if (h.photo) { photoId = FB.newId(); tx.set('fichiers/' + photoId, { data: h.photo, type: 'image/jpeg', nom: 'Contrôle ' + num, par: S.user.uid, ts: FB.TS() }); }
          lines.forEach(function (l, i) {
            var t = plist('typesControle', TYPES_CONTROLE_DEFAUT).filter(function (x) { return x.id === l.type; })[0] || {};
            tx.doc('qualite/controles', FB.newId(), { num: num, date: h.date, lot: lotId, lotNum: L.num, objet: objet, type: l.type, typeNom: t.nom || l.type, methode: l.methode || null, resultat: l.resultat, conforme: l.ok === '1', photo: photoId, obs: h.obs || null, par: S.user.uid, parNom: S.member.nom });
          });
          var q = lotQty(lotId).parEmp.QUAR || 0;
          var dest = objet === 'tissu' ? (L.classement === 'Second choix' ? 'SC' : 'PF') : 'MAG-FT';
          if (h.decision === 'conforme') {
            if (q > 0) tx.mvt({ type: 'liberation', art: L.art, lot: lotId, q: q, from: 'QUAR', to: dest, src: 'qualite', date: h.date, doc: doc });
            tx.field('stock/lots', lotId, 'statutQ', 'conforme');
            if (tei) tx.field('teinture/lots', L.tei, 'statut', 'conforme');
          } else {
            tx.field('stock/lots', lotId, 'statutQ', 'non_conforme');
            if (tei) tx.field('teinture/lots', L.tei, 'statut', h.decision === 'rebut' ? 'rebut' : h.decision === 'reprise' ? 'reprise' : 'non_conforme');
            if (h.decision === 'rebut' && q > 0) tx.mvt({ type: 'rejet_qualite', art: L.art, lot: lotId, q: q, from: 'QUAR', src: 'qualite', date: h.date, doc: doc, motif: 'Rebut après contrôle : ' + (h.cause || '') });

          }
          tx.audit('Contrôle qualité ' + num + ' du lot ' + L.num + ' : ' + h.decision, 'qualite', lotId);

function clientOf(id) { return get('ventes/clients', id); }
function clientName(id, f) { var c = clientOf(id); return c ? c.nom : (f && f.clientNom) || 'Client de passage'; }
function facDu(f) { return (f.net || 0) - (f.avoirs || 0); }
function facReste(f) { return f.statut === 'annulee' || f.statut === 'attente' ? 0 : facDu(f) - (f.paye || 0) + (f.rembourse || 0); }
function facEtat(f) { if (f.statut === 'attente') return 'attente'; if (f.statut === 'annulee') return 'annulee'; var r = facReste(f); return r <= 0 ? 'payee' : (f.paye > 0 ? 'payee_partiel' : 'impayee'); }
function facRetard(f) { return facReste(f) > 0 && f.echeance && f.echeance < today() ? daysBetween(f.echeance, today()) : 0; }
function encoursClient(cid) { return sum(list('ventes/factures', function (f) { return f.client === cid; }), function (f) { return Math.max(0, facReste(f)); }); }
function tarifOf(art) { return list('ventes/tarifs', function (t) { return t.art === art; })[0] || null; }
function prixTarif(art, tarif, unite) {
  var t = tarifOf(art); if (!t) return null;
  if (unite === 'piece') return t[(tarif || 'detail') + 'Piece'] || t.detailPiece || null;
  return t[tarif || 'detail'] || t.detail || null;
}

  },
  parseSrc: function (src) {

  calcLigne: function (l, tarif) {

    var qty = l.mode === 'piece' ? 1 : fromQ(l.q || 0);
    var brut = Math.round(qty * (l.pu || 0)), rem = Math.round(brut * (l.remise || 0) / 100);

    if (preset.lignes) rows = preset.lignes;
    var clientTarif = function (root) { var c = clientOf(($('[data-k="client"]', root) || {}).value); return c ? c.tarif : 'detail'; };
    var lid;
    var cols = [

      { k: 'mode', t: 'Vendu', type: 'select', req: true, opts: [['m', 'Au mètre'], ['piece', 'Pièce entière']], dflt: 'm' },
      { k: 'q', t: 'Quantité (m ou unités)', type: 'qty' },

      { k: 'remise', t: 'Remise %', type: 'number' },

    ];
    var mm;
    return docModal({
      title: fromCmd ? 'Facturer la commande ' + fromCmd.num : 'Nouvelle vente', size: 'xl',
      fields: [
        { k: 'client', t: 'Client', type: 'select', opts: function () { return Opt.clients(); }, emptyLabel: 'Client de passage', dflt: preset.client || (fromCmd && fromCmd.client) },
        { k: 'clientNom', t: 'Nom (client de passage)', ph: 'facultatif' },
        { k: 'date', t: 'Date', type: 'date', req: true, dflt: today() },
        { k: 'echeance', t: 'Échéance (si crédit)', type: 'date' },
        { type: 'section', t: 'Encaissement' },
        { k: 'paye', t: 'Montant encaissé maintenant (GNF)', type: 'money' },
        { k: 'compte', t: 'Encaissé sur', type: 'select', opts: Opt.comptes, dflt: 'caisse' },
        { k: 'ref', t: 'Référence (transaction Orange Money…)' },
        { k: 'notes', t: 'Notes sur la facture', span: 2 }
      ],
      linesTitle: 'Articles vendus',
      lines: { cols: cols, rows: rows, opts: {
        foot: function (ls) {
          var tot = sum(ls, function (l) { return Ventes.calcLigne(l).net; }), acompte = fromCmd ? (fromCmd.acompte || 0) : 0;
          return 'Total à payer : <strong id="vt-total" data-v="' + tot + '">' + fmtGNF(tot) + '</strong>' + (acompte ? ' — acompte déjà versé : ' + fmtGNF(acompte) : '');
        },
        onField: function (k, tr, l, root) {
          var s = Ventes.parseSrc(l.src);
          if ((k === 'src' || k === 'mode') && s) {

            var pu = prixTarif(s.art, clientTarif(root), l.mode === 'piece' ? 'piece' : 'm');
            $('[data-lk="pu"]', tr).value = pu || '';
            var qi = $('[data-lk="q"]', tr);
            if (l.mode === 'piece') { qi.value = qInput(soldeOf(s.art, s.lot, s.emp).q); qi.readOnly = true; } else { qi.readOnly = false; if (k === 'mode') qi.value = ''; }
            if (a.nature !== 'tissu') { $('[data-lk="mode"]', tr).value = 'm'; }

        }
      } },
      ok: 'Valider la vente',
      onOpen: function (m, l) {
        mm = m; lid = l;
        var cs = $('[data-k="client"]', m.el), paye = $('[data-k="paye"]', m.el), ech = $('[data-k="echeance"]', m.el);
        var sync = function () {

          paye.readOnly = !credit;
          ech.closest('.fld').hidden = !credit;
          if (!credit) { var t = $('#vt-total', m.el); paye.value = t ? Math.max(0, Number(t.dataset.v) - (fromCmd ? (fromCmd.acompte || 0) : 0)) : ''; }
          if (c && !ech.value) ech.value = addDays(today(), c.delai || (S.params.regles || {}).delaiPaiement || 30);
          var hint = $('.muted', paye.closest('.fld'));
          var h = c ? (credit ? 'Crédit autorisé : encours ' + fmtGNF(encoursClient(c.id)) + ' sur un plafond de ' + fmtGNF(c.plafond) + '.' : 'Ce client n\'a pas de plafond de crédit : paiement complet.') : 'Client de passage : paiement complet.';
          var sm = paye.closest('.fld').querySelector('small.muted'); if (!sm) { sm = document.createElement('small'); sm.className = 'muted'; paye.closest('.fld').insertBefore(sm, paye.closest('.fld').querySelector('.ferr')); } sm.textContent = h;
        };
        cs.addEventListener('change', sync);
        m.el.addEventListener('input', function (e) { if (e.target.closest('[data-lines]')) setTimeout(sync, 0); });
        m.el.addEventListener('change', function (e) { if (e.target.closest('[data-lines]')) setTimeout(sync, 0); });
        setTimeout(sync, 50);
      },
      check: function (h, lines) {
        var c = clientOf(h.client);
        var parSrc = {};
        for (var i = 0; i < lines.length; i++) {
          var l = lines[i], s = Ventes.parseSrc(l.src); if (!s) return 'Ligne ' + (i + 1) + ' : produit introuvable.';
          if (l.mode !== 'piece' && !(l.q > 0)) return 'Ligne ' + (i + 1) + ' : indiquez la quantité.';
          var dispo = soldeOf(s.art, s.lot, s.emp).q;
          parSrc[l.src] = (parSrc[l.src] || 0) + (l.mode === 'piece' ? dispo : l.q);
          if (parSrc[l.src] > dispo) return 'Ligne ' + (i + 1) + ' : il ne reste que ' + fmtQ(dispo, artUnit(s.art)) + '.';
          if ((l.remise || 0) < 0 || (l.remise || 0) > 100) return 'Ligne ' + (i + 1) + ' : remise invalide.';
        }
        var total = sum(lines, function (l) { return Ventes.calcLigne(l).net; });
        var acompte = fromCmd ? (fromCmd.acompte || 0) : 0;
        var paye = h.paye || 0;
        if (paye + acompte > total) return 'Le montant encaissé dépasse le total.';
        var reste = total - paye - acompte;
        if (reste > 0) {
          if (!c || !(c.plafond > 0)) return 'Vente à crédit impossible : choisissez un client avec un plafond de crédit, ou encaissez le total.';
          if (encoursClient(c.id) + reste > c.plafond) return 'Plafond de crédit dépassé : encours ' + fmtGNF(encoursClient(c.id)) + ' + ' + fmtGNF(reste) + ' > ' + fmtGNF(c.plafond) + '.';
          if (!h.echeance) return "Indiquez l'échéance du crédit.";
        }
        if (paye > 0 && !h.compte) return 'Choisissez où l\'argent est encaissé.';
      },
      save: function (h, lines) {
        var c = clientOf(h.client), tarif = c ? c.tarif : 'detail';
        var remMax = Number((S.params.regles || {}).remiseMax || 0);
        var exceptions = [];
        var lignes = lines.map(function (l) {
          var s = Ventes.parseSrc(l.src), a = articleOf(s.art) || {};
          var q = l.mode === 'piece' ? soldeOf(s.art, s.lot, s.emp).q : l.q;
          var calc = Ventes.calcLigne(l);
          var pt = prixTarif(s.art, tarif, l.mode === 'piece' ? 'piece' : 'm');
          if ((l.remise || 0) > remMax) exceptions.push('remise de ' + l.remise + ' % sur ' + a.nom);
          if (pt && l.pu < pt) exceptions.push('prix ' + fmtMoney(l.pu) + ' inférieur au tarif ' + fmtMoney(pt) + ' sur ' + a.nom);
          return { art: s.art, lot: s.lot, emp: s.emp, mode: l.mode, q: q, pu: l.pu, prixTarif: pt || null, remise: l.remise || 0, brut: calc.brut, montantRemise: calc.remise, net: calc.net };
        });
        var total = sum(lignes, function (l) { return l.brut; }), remise = sum(lignes, function (l) { return l.montantRemise; }), net = total - remise;
        var acompte = fromCmd ? (fromCmd.acompte || 0) : 0;
        var fid = FB.newId();
        return nextNum('FAC', h.date).then(function (num) {
          var fac = { num: num, date: h.date, client: h.client || null, clientNom: h.client ? null : (h.clientNom || null), tarif: tarif, lignes: lignes, total: total, remise: remise, net: net, paye: 0, avoirs: 0, rembourse: 0,
            echeance: (net - (h.paye || 0) - acompte) > 0 ? h.echeance : h.date, notes: h.notes || null, cmd: fromCmd ? fromCmd.id : null, cmdNum: fromCmd ? fromCmd.num : null,
            encaissementPrevu: h.paye > 0 ? { montant: h.paye, compte: h.compte, ref: h.ref || null } : null, par: S.user.uid, parNom: S.member.nom };
          if (exceptions.length && !(can('ventes', 'valider') && Valid.unique())) {
            fac.statut = 'attente'; fac.exceptions = exceptions;
            var tx0 = new Tx('facture'); tx0.doc('ventes/factures', fid, fac);
            tx0.audit('Facture ' + num + ' en attente de validation : ' + exceptions.join(' ; '), 'ventes', fid);
            return tx0.commit().then(function () { return Valid.request({ type: 'ventes.facture', module: 'ventes', label: 'Facture ' + num + ' (' + fmtGNF(net) + ') : ' + exceptions.join(' ; '), payload: { facture: fid } }); })
              .then(function () { UI.toast('Remise ou prix hors tarif : la facture attend la validation d\'un responsable.', 'info', 7000); return { id: fid, attente: true }; });
          }

            if (fromCmd) { tx.field('ventes/commandes', fromCmd.id, 'statut', 'livree'); tx.field('ventes/commandes', fromCmd.id, 'facture', num); }
            return tx.commit().then(function () { return { id: fid, rc: rc }; });
          });
