Valid.register('ventes.facture', 'Facture avec remise ou prix hors tarif', function (p, tx) {
  var f = clone(get('ventes/factures', p.facture)); if (!f) throw new Error('Facture introuvable.');
  if (f.statut !== 'attente') throw new Error('Cette facture a déjà été traitée.');
  f.statut = 'validee'; delete f.id;
  /* le numéro de reçu est attribué au moment de l'approbation */
  var enc = f.encaissementPrevu && f.encaissementPrevu.montant > 0;
  return (enc ? nextNum('RC', f.date) : Promise.resolve(null)).then(function (rc) {
    var cmd = f.cmd ? get('ventes/commandes', f.cmd) : null;
    Ventes.executer(p.facture, f, tx, rc, cmd ? (cmd.acompte || 0) : 0);
    if (cmd) { tx.field('ventes/commandes', f.cmd, 'statut', 'livree'); tx.field('ventes/commandes', f.cmd, 'facture', f.num); }
  });
});
Valid.needs['ventes.facture'] = ['ventes/factures', 'ventes/commandes', 'ventes/clients', 'stock/soldes', 'stock/lots', 'stock/articles', 'finances/comptes'];
Valid.onReject['ventes.facture'] = function (p, tx) { tx.field('ventes/factures', p.facture, 'statut', 'annulee'); };

Valid.register('ventes.avoir', 'Retour ou annulation de vente', function (p, tx, req) {
  var f = get('ventes/factures', p.facture); if (!f) throw new Error('Facture introuvable.');
  var doc = { t: 'AV', id: p.facture, n: 'Avoir ' + f.num };
  var lignes = clone(f.lignes);
  (p.lignes || []).forEach(function (r) {
    var l = lignes[r.idx];
    var val = Math.round((l.cout || 0) * r.q / l.q);
    var L = l.lot !== '_' ? get('stock/lots', l.lot) : null;
    tx.mvt({ type: 'retour_client', art: l.art, lot: l.lot, q: r.q, to: L ? 'QUAR' : l.emp, val: val, src: 'ventes', date: p.date, doc: doc, motif: req.motif });
    if (L) { tx.field('stock/lots', l.lot, 'statutQ', 'attente'); tx.field('stock/lots', l.lot, 'retour', true); }
    l.retourne = (l.retourne || 0) + r.q;
    l.coutRetourne = (l.coutRetourne || 0) + val;
  });
  var montant = p.montant || 0;
  var coutRet = sum(p.lignes || [], function (r) { var l = f.lignes[r.idx]; return Math.round((l.cout || 0) * r.q / l.q); });
  tx.field('ventes/factures', p.facture, 'lignes', lignes);
  tx.inc('d/ventes/factures/' + p.facture + '/avoirs', montant);
  tx.inc('d/ventes/factures/' + p.facture + '/cout', -coutRet);
  var tous = lignes.every(function (l) { return (l.retourne || 0) >= l.q; });
  if (tous && (f.net - (f.avoirs || 0) - montant) <= 0) tx.field('ventes/factures', p.facture, 'annuleeTotal', true);
  tx.field('ventes/factures', p.facture, 'avoirsDetail', (f.avoirsDetail || []).concat([{ date: p.date, montant: montant, rembourse: p.rembourser || 0, motif: req.motif || '' }]));
  if (p.rembourser > 0) {
    tx.op({ compte: p.compte, sens: 's', montant: p.rembourser, date: p.date, cat: 'remboursement', centre: 'commercial', src: 'ventes', doc: { t: 'FAC', id: p.facture, n: f.num }, libelle: 'Remboursement avoir ' + f.num, tiers: clientName(f.client, f) });
    tx.inc('d/ventes/factures/' + p.facture + '/rembourse', p.rembourser);
  }
});
Valid.needs['ventes.avoir'] = ['ventes/factures', 'stock/soldes', 'stock/lots', 'stock/articles'];

Valid.register('ventes.prix', 'Changement de prix', function (p, tx, req) {
  var tid = p.tarifId || FB.newId();
  var cur = get('ventes/tarifs', tid) || { art: p.art };

});

   paiements, planning, présences, travaux pratiques, évaluations,

   tissus produits en formation n'entrent pas seuls au stock commercial.

var FORM_TYPES = [['petit_metier', 'Petit métier'], ['grand_metier', 'Grand métier'], ['teinture', 'Teinture'], ['preparation', 'Préparation des fils'], ['motifs', 'Motifs traditionnels'], ['finitions', 'Techniques de finition'], ['autre', 'Formation personnalisée']];
function sessionOf(id) { return get('formation/sessions', id); }
function formationOf(id) { return get('formation/formations', id); }
function apprenantOf(id) { return get('formation/apprenants', id); }
function appName(id) { var a = apprenantOf(id); return a ? (a.prenom ? a.prenom + ' ' : '') + a.nom : '—'; }
function insReste(i) { return i.statut === 'annulee' ? 0 : (i.total || 0) - (i.paye || 0); }
function insEchu(i) { return (i.echeances || []).filter(function (e) { return e.date < today(); }).reduce(function (t, e) { return t + (e.montant || 0); }, 0) - (i.paye || 0); }
function sessionLabel(s) { var f = formationOf(s.formation) || {}; return (s.code ? s.code + ' — ' : '') + (f.intitule || '') + ' (' + fmtDate(s.debut) + ')'; }

/* Présence et moyenne d'un apprenant dans une session */
function presenceStats(sid, aid) {
  var p = col('formation/presences')[sid] || {};
  var n = 0, pres = 0;
  Object.keys(p).forEach(function (d) { var x = p[d] && p[d][aid]; if (x) { n++; if (x.s === 'P' || x.s === 'R') pres++; } });
  return { n: n, pres: pres, taux: n ? pres / n : null };
}
function moyenne(sid, aid) {
  var ev = list('formation/evaluations', function (e) { return e.session === sid; });
  var notes = []; ev.forEach(function (e) { var x = (e.notes || {})[aid]; if (x && x.note !== null && x.note !== undefined && x.note !== '') notes.push(Number(x.note) * (e.coef || 1)); });
  var coefs = ev.filter(function (e) { var x = (e.notes || {})[aid]; return x && x.note !== null && x.note !== undefined && x.note !== ''; }).reduce(function (t, e) { return t + (e.coef || 1); }, 0);
  return coefs ? sum(notes) / coefs : null;
}

      onOpen: function (m) {

/* Une ligne = tableau de valeurs ; les colonnes déclarent leur format. */
function rapCell(c, v) {
  if (v === null || v === undefined || v === '') return '';
  if (c.f === 'money') return canMoney() ? fmtMoney(v) : '•••';
  if (c.f === 'q') return fmtQ(v);
  if (c.f === 'pct') return fmtPct(v);
  if (c.f === 'n') return fmtN(v, c.dec || 0);

function rapExportVal(c, v) {
  if (v === null || v === undefined) return '';

}

Rap.methodes = function () {
  detailModal('Méthodes de calcul',
    '<h3>Stock</h3><p>Le stock d\'un article est la somme des mouvements validés (entrées moins sorties), par lot et par emplacement. Le disponible ne compte que les emplacements utilisables : la quarantaine, les encours et le rebut en sont exclus. Une sortie qui rendrait le stock négatif est refusée par le serveur, sauf exception autorisée par le propriétaire.</p>' +
    '<h3>Valorisation</h3><p>Les articles sans lot sont valorisés au coût moyen pondéré de leur emplacement : à chaque entrée, le coût moyen devient (stock × coût moyen + entrée × coût d\'entrée) ÷ (stock + entrée). Les lots (fils teints, pièces) portent leur coût réel, calculé à leur fabrication. Quand tout le stock d\'un emplacement sort, toute sa valeur sort aussi.</p>' +
    '<h3>Lot de teinture</h3><p>Perte = poids engagé − poids obtenu. Rendement = poids obtenu ÷ poids engagé. Coût du lot = fil engagé + produits consommés + main-d\'œuvre (heures × taux) + autres frais + dépenses imputées. Coût par kg = coût du lot ÷ poids obtenu : la perte normale est absorbée par le fil obtenu.</p>' +
    '<h3>Ordre de production</h3><p>Coût = fil réellement consommé (sorti − rendu) + consommables + main-d\'œuvre du suivi journalier (heures × taux, ou mètres × tarif à la tâche) + finitions + dépenses imputées. Coût par mètre = coût ÷ mètres conservés (acceptés + second choix). Les mètres au rebut n\'ont pas de valeur ; leur coût est réparti sur les mètres conservés et affiché à part.</p>' +
    '<h3>Ventes et marge</h3><p>Chaque ligne de facture fige le coût de la longueur vendue au moment de la vente. Marge brute = montant net − coût figé. Un changement de coût ultérieur ne modifie jamais une marge passée.</p>' +
    '<h3>Trésorerie</h3><p>Chaque entrée ou sortie d\'argent est une opération unique rattachée à son document. Le « payé » d\'une facture est la somme de ses encaissements. Une dépense ne peut créer qu\'une seule opération (identifiant réservé). Un mois clôturé n\'accepte plus aucune opération.</p>' +
    '<h3>Résultat estimé</h3><p>Marge brute + marge de la formation − charges de la période non incorporées aux produits − main-d\'œuvre payée au-delà de celle déjà incorporée aux lots et ordres − pertes (rejets, sorties exceptionnelles, écarts d\'inventaire). Les achats de matières ne sont pas des charges : ils deviennent du stock puis un coût de revient au moment de la vente. Les dépenses imputées à un lot ou à un ordre sont considérées comme incorporées à son coût.</p>' +
    '<h3>Chiffre d\'affaires, encaissements, trésorerie</h3><p>Le chiffre d\'affaires est daté de la facture ; les encaissements, de la date du paiement ; le solde de trésorerie est l\'argent disponible à l\'instant. Ce sont trois notions différentes.</p>');
};

view('admin/sauvegarde', {
  mod: 'admin', title: 'Sauvegarde',
  render: function () {
    return pageHead('Sauvegarde', 'Téléchargez une copie complète des données de votre atelier, tous blocs compris.') +
      '<section class="card pad"><p>La sauvegarde contient toutes vos données (paramètres, gérants, stocks, mouvements, ventes, formations, finances, journal d\'audit) de chacun des ' + plural(blocIdsAll().length, 'bloc') + ', dans un fichier que vous conservez hors de la plateforme. Faites-en une au moins chaque semaine et gardez-la sur un autre appareil.</p>' +
      (isOwnerRole() ? UI.btn(icon('download') + ' Télécharger la sauvegarde complète', 'backup', 'primary', ' data-needs-net') : '<p class="muted">Réservé au propriétaire de l\'atelier.</p>') +
      (LS.get('nerp_derniere_sauvegarde_' + S.tid) ? '<p class="small muted">Dernière sauvegarde depuis cet appareil : ' + fmtDateTime(Number(LS.get('nerp_derniere_sauvegarde_' + S.tid))) + '</p>' : '') + '</section>';
  },
  acts: {
    backup: function (id, b) {
      runOp(b, function () {
        /* la base n'autorise la lecture que nœud par nœud : on les rassemble */
        /* nœuds communs, puis les données de chaque bloc (BLOC A sous d, les autres sous blocs/X/d) */
        var T = 't/' + S.tid + '/';
        var mods = ['parametres', 'stock', 'achats', 'teinture', 'production', 'qualite', 'ventes', 'formation', 'finances', 'admin'];
        var nodes = ['info', 'params', 'roles', 'members', 'compteurs', 'audit', 'fichiers', 'support', 'blocsInfo'].map(function (n) { return { p: T + n, put: function (d, v) { d[n] = v; } }; });
        blocIdsAll().forEach(function (b) {
          mods.forEach(function (m) {
            nodes.push({ p: T + (b === 'A' ? 'd/' : 'blocs/' + b + '/d/') + m, put: function (d, v) { if (b === 'A') { d.d = d.d || {}; d.d[m] = v; } else { d.blocs = d.blocs || {}; d.blocs[b] = d.blocs[b] || { d: {} }; d.blocs[b].d[m] = v; } } });
          });
        });
        return Promise.all(nodes.map(function (n) { return FB.withTimeout(FB.ref(n.p).once('value'), 120000, 'sauvegarde').then(function (s) { return s.val(); }, function () { return null; }); })).then(function (vals) {
          var data = { d: {} };
          nodes.forEach(function (n, i) { if (vals[i] !== null && vals[i] !== undefined) n.put(data, vals[i]); });
          var out = { format: 'agat-sauvegarde', version: 2, atelier: S.tenant.nom, code: S.tenant.code, blocs: blocIdsAll(), date: new Date().toISOString(), donnees: data };
          UI.download('sauvegarde-' + normIdent(S.tenant.nom).replace(/\./g, '-') + '-' + today() + '.json', 'application/json', JSON.stringify(out));
          LS.set('nerp_derniere_sauvegarde_' + S.tid, String(Date.now()));
          var tx = new Tx('audit'); tx.audit('Sauvegarde complète téléchargée', 'admin'); return tx.commit();
        });
      }, 'Sauvegarde téléchargée.');
    }
  }
});

/* ===== 99-boot.js ===== */
/* =====================================================================
   Démarrage
   ===================================================================== */
(function () {
  var booted = false;

  function configScreen() {
    var el = $('#scr-config');
    el.innerHTML = '<div class="blocked">' + Brand.mark(44) + '<h1>Configuration à terminer</h1>' +
      '<p class="lead">L\'application n\'est pas encore reliée à sa base de données.</p>' +
      '<p>Ouvrez le fichier <span class="code">config.js</span> déployé à côté de <span class="code">index.html</span> et collez-y la configuration Web de votre projet Firebase (voir le guide de déploiement, étape 4), puis redéployez.</p></div>';
    Screens.show('scr-config');
  }
  function sdkError() {
    var el = $('#scr-boot');
    el.innerHTML = '<div class="blocked">' + Brand.mark(44) + '<h1>Connexion impossible</h1><p class="lead">Les composants de l\'application n\'ont pas pu être chargés. Vérifiez la connexion Internet de cet appareil.</p><button type="button" class="btn primary" onclick="location.reload()">Réessayer</button></div>';
    Screens.show('scr-boot');
  }

  function route(user) {
    var params = new URLSearchParams(location.search);
    var code = cleanCode(params.get('e') || params.get('shop') || '');
    var mode = sessionStorage.getItem('nerp_mode');
    var sess = Device.session();
    if (user && mode === 'concepteur') {
      FB.get('platform/admins/' + user.uid).then(function (a) {
        if (a) Concepteur.start(user, a); else { sessionStorage.removeItem('nerp_mode'); FB.auth.signOut(); Landing.render(); }
      }).catch(function () { Landing.render(); });
      return;
    }
    if (user && sess && sess.uid === user.uid && sess.tid) {
      if (code && sess.code && code !== sess.code) { /* lien vers une autre entreprise : on se déconnecte proprement */
        FB.auth.signOut().then(function () { Device.clearSession(); Landing.render(); Landing.go(code); }); return;
      }
      App.enter(sess.tid, sess.code); return;
    }
    if (user) { FB.auth.signOut(); }
    Landing.render();
    if (code) Landing.go(code);
  }

  function start(n) {
    n = n || 0;
    if (!FB.configOk()) { configScreen(); return; }
    if (typeof firebase === 'undefined' || !firebase.auth || !firebase.database) {
      if (n > 150) { sdkError(); return; }
      setTimeout(function () { start(n + 1); }, 100);
      return;
    }
    try { FB.init(); } catch (e) { console.error(e); sdkError(); return; }
    Platform.load().then(function () { if (document.body.dataset.screen === 'scr-landing') Landing.render(($('.home-msg') || {}).textContent); });
    FB.auth.onAuthStateChanged(function (user) {
      if (!booted) { booted = true; route(user); return; }
      if (!user && /scr-app|scr-concepteur|scr-blocked/.test(document.body.dataset.screen || '')) {
        Data.stopAll(); UI.closeAll(); Concepteur.stop(); Landing.render();
      }
    });
  }

  Install.init();
  document.addEventListener('DOMContentLoaded', function () {
    Screens.show('scr-boot');
    start(0);
  });
  /* hors ligne / en ligne au niveau du navigateur (en plus de Firebase) */
  window.addEventListener('offline', function () { S.online = false; Bus.emit('online', false); });
})();
